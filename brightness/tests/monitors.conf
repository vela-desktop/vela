#
# The monitors measured in docs/brightness.md §3, as fake monitors
# (src/fake.h), and two without brightness.

# LG FULL HD: ignores a write 5 to 190 ms after another; 2 bad replies in 160.
[HDMI-A-1]
ignore-write-gap = 5-190
bad-replies = 2

# Mi Monitor: loses writes at any pause; half its replies are a fixed block.
[DP-3]
drop-writes = 30
bad-replies = 50

# DDC/CI turned off in the monitor's menu.
[OFF-1]
ddc = no

[NOBUS-1]
no-bus = yes
