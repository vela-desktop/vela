name: Benchmark lifecycle
on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'scripts/vela-bench*'
      - '.github/workflows/benchmark-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - 'scripts/vela-bench*'
      - '.github/workflows/benchmark-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start disposable runner user manager
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Native transient instrument completion and cleanup
        run: python3 benchmarks/tests/instrument_integration.py
      - name: Native takeover conditions, freezer and interrupted recovery
        run: python3 benchmarks/tests/quiescence_integration.py
      - name: Native greeter service outside the display-manager cgroup
        run: python3 benchmarks/tests/greeter_integration.py
      - name: Deadline releases setsid descendants and independent instruments
        run: python3 benchmarks/tests/selftest_timeout_integration.py
