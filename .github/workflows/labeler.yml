# Metadata-only: never check out or execute code from pull requests.
name: Label pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write # Only to create area labels the first time they are encountered

jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false # Preserve manually assigned labels
