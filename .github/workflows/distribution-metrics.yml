name: Distribution metrics

on:
  pull_request:
    paths:
      - '.github/workflows/distribution-metrics.yml'
      - 'scripts/github_distribution_metrics.py'
      - 'scripts/tests/test_github_distribution_metrics.py'
      - 'docs/distribution-metrics.md'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vela-distribution-metrics
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test metrics collector
        run: python3 -m unittest discover -s scripts/tests -p 'test_github_distribution_metrics.py'

  collect:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Prepare metrics branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/github_distribution_metrics.py "${RUNNER_TEMP}/github_distribution_metrics.py"
          if git ls-remote --exit-code --heads origin metrics >/dev/null; then
            git fetch origin metrics
            git switch --track -c metrics origin/metrics
          else
            git switch --orphan metrics
            git rm -rf --ignore-unmatch .
            git clean -fd
          fi
      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VELA_TRAFFIC_TOKEN: ${{ secrets.VELA_TRAFFIC_TOKEN }}
        run: python3 "${RUNNER_TEMP}/github_distribution_metrics.py" --output .
      - name: Commit snapshot if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "data: archive GitHub distribution metrics"
          git push origin HEAD:metrics
