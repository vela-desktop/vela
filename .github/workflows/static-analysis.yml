name: Static Analysis

# PR validation, and on main to prime the analysis compiler cache and to
# notice when a new analyzer release changes the counts.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.paths.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] || ! git rev-parse 'HEAD^2' >/dev/null 2>&1; then
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
          else
            # Capture all changed paths; avoid grep -q / SIGPIPE with pipefail.
            non_docs=$(git diff --name-only 'HEAD^1' 'HEAD^2' |
                grep -Ev '^(docs/|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|.*\.md$)' || true)
            if [ -n "$non_docs" ]; then
              echo 'heavy=true' >> "$GITHUB_OUTPUT"
            else
              echo 'heavy=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  # Every tracked shell script, found by its shebang: the updater (which runs
  # sudo), the session scripts, CI and packaging helpers. Cheap, so it runs
  # on every PR, docs-only ones included.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck all shell scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version | sed -n 2p
          # Match the interpreter after an optional env or env -S prefix.
          shell_shebang='^#![[:blank:]]*/([^[:blank:]]*/)?(env[[:blank:]]+(-S[[:blank:]]+)?)?(bash|dash|sh)([[:blank:]]|$)'
          git ls-files -z | {
            scripts=()
            while IFS= read -r -d '' file; do
              [[ -f $file ]] || continue
              IFS= read -r shebang < "$file" || [[ -n $shebang ]] || continue
              [[ $shebang =~ $shell_shebang ]] || continue

              scripts+=("$file")
              printf '  %q\n' "$file"
              case ${BASH_REMATCH[4]} in
                bash) bash -n -- "$file" ;;
                dash|sh) sh -n -- "$file" ;;
              esac
            done
            printf 'Checking %d scripts with ShellCheck\n' "${#scripts[@]}"
            if ((${#scripts[@]})); then
              shellcheck -S warning -x -- "${scripts[@]}"
            fi
          }

  # clang-format on the C and C++ lines this PR changes, nothing else:
  # existing code follows .clang-format as it is touched.
  clang-format:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install clang-format 18
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-format-18
      - name: Check the changed lines
        shell: bash
        run: |
          # HEAD is the PR merged into its base; HEAD^1 is the base.
          # Stream the patch to the log and propagate the formatter's status.
          bash scripts/format-changed.sh 'HEAD^1' --diff

  # Both lanes of docs/ci-lanes.md analyse every first-party translation unit
  # of a full Clang build: the Clang Static Analyzer (through clang-tidy) and
  # cppcheck in both, Clazy and qmllint in the Qt lane. Each finding count is
  # held to its ceiling in scripts/ci-findings-ceilings.json. The native lane
  # runs in one job; the Qt lane's clang-tidy, its slowest part, is split
  # over three runners, and a last job compares the Qt lane's counts.
  static-analysis:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    env: &analysis-env
      CCACHE_DIR: ${{ github.workspace }}/.ccache-analysis
      CCACHE_MAXSIZE: 1G
    steps:
      - &dependencies
        name: Dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel git cmake ninja ccache python clang clang-tools-extra clazy cppcheck
          shaderc vulkan-headers vulkan-icd-loader gtest openssh
          wayland wayland-protocols wlroots0.20 libxkbcommon pixman libinput libdrm mesa
          freetype2 harfbuzz fontconfig librsvg cairo zlib pam polkit
          qt6-base qt6-declarative qt6-svg qt6-wayland qt6-tools qt6-multimedia layer-shell-qt
          hicolor-icon-theme pipewire wireplumber systemd-libs

      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ci-lanes.py lists the tracked sources with git; the checkout belongs
      # to another user than the container's root.
      - &trust
        name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - &cache
        name: Restore analysis compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-analysis
          key: ccache-arch-clang-analysis-v1-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            ccache-arch-clang-analysis-v1-

      # Everything that can be built, GPU test tools included, so that every
      # tracked C and C++ file is compiled; ci-lanes.py checks that it is.
      - &configure
        name: Configure with Clang
        run: >-
          cmake -S . -B build-analysis -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DVELA_BUILD_TOOLS=ON -DVELA_BUILD_GPU_TEST_TOOLS=ON

      # The analysers need generated headers and moc output.
      - &build
        name: Build
        run: |
          ccache --zero-stats
          cmake --build build-analysis
          ccache --show-stats

      - name: Analyse the native lane
        run: bash scripts/static-analysis.sh native build-analysis analysis-reports

      - name: Upload analysis reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-native
          path: |
            analysis-reports/*.log
            analysis-reports/findings.txt
          if-no-files-found: ignore
          retention-days: 14

  static-analysis-qt-part:
    name: static-analysis-qt (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    env: *analysis-env
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: clang-tidy 1/3
            args: --only clang-tidy --shard 1/3
          - part: clang-tidy 2/3
            args: --only clang-tidy --shard 2/3
          - part: clang-tidy 3/3
            args: --only clang-tidy --shard 3/3
          - part: cppcheck, Clazy, qmllint
            args: --only tools
    steps:
      - *dependencies
      - *checkout
      - *trust
      - *cache
      - *configure
      - *build
      - name: Analyse part of the Qt lane
        env:
          PART_ARGS: ${{ matrix.args }}
        run: |
          # PART_ARGS is split into words on purpose.
          # shellcheck disable=SC2086
          bash scripts/static-analysis.sh qt build-analysis analysis-reports $PART_ARGS

      - name: Upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-qt-logs-${{ strategy.job-index }}
          path: |
            analysis-reports/*.log
            analysis-reports/source.txt
          if-no-files-found: error
          retention-days: 14

  # The Qt lane's counts, from all of its parts together.
  static-analysis-qt:
    needs: [changes, static-analysis-qt-part]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: static-analysis-qt-logs-*
          path: qt-logs
          merge-multiple: true

      - name: Compare the Qt lane with its ceilings
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          args=()
          for log in qt-logs/clang-tidy-*.log; do args+=(--clang-tidy "$log"); done
          # Pairs of words: one --clang-tidy LOG per shard of static-analysis-qt-part.
          (( ${#args[@]} == 2 * 3 )) || { echo "expected 3 clang-tidy logs, found $(( ${#args[@]} / 2 ))" >&2; exit 1; }
          for tool in cppcheck clazy qmllint; do
            [[ -f qt-logs/$tool.log ]] || { echo "missing qt-logs/$tool.log" >&2; exit 1; }
            args+=("--$tool" "qt-logs/$tool.log")
          done
          # The parts ran in a container: their logs name its source tree.
          python3 scripts/ci-findings.py qt "${args[@]}" --source "$(cat qt-logs/source.txt)" --list \
            > findings.txt

      - name: Upload the findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-qt
          path: findings.txt
          if-no-files-found: ignore
          retention-days: 14
