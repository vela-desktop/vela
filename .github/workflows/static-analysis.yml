name: Static Analysis

# PR validation only; post-merge build and packaging run in build.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.paths.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] || ! git rev-parse 'HEAD^2' >/dev/null 2>&1; then
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
          else
            # Capture all changed paths; avoid grep -q / SIGPIPE with pipefail.
            non_docs=$(git diff --name-only 'HEAD^1' 'HEAD^2' |
                grep -Ev '^(docs/|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|.*\.md$)' || true)
            if [ -n "$non_docs" ]; then
              echo 'heavy=true' >> "$GITHUB_OUTPUT"
            else
              echo 'heavy=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  # Every tracked shell script, found by its shebang: the updater (which runs
  # sudo), the session scripts, CI and packaging helpers. Cheap, so it runs
  # on every PR, docs-only ones included.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck all shell scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version | sed -n 2p
          mapfile -t scripts < <(git ls-files -z | while IFS= read -r -d '' file; do
            [ -f "$file" ] && head -n1 -- "$file" | grep -qE '^#!.*[/ ](ba|da)?sh( |$)' && printf '%s\n' "$file"
          done)
          printf 'Checking %d scripts\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          for script in "${scripts[@]}"; do
            if head -n1 -- "$script" | grep -q bash; then bash -n "$script"; else sh -n "$script"; fi
          done
          shellcheck -S warning -x "${scripts[@]}"

  static-analysis:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    steps:
      - name: Install Arch build and analysis tools
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel git cmake python clang clang-tools-extra cppcheck shellcheck
          shaderc vulkan-headers vulkan-icd-loader wayland wayland-protocols
          wlroots0.20 libxkbcommon pixman libinput libdrm mesa
          freetype2 harfbuzz fontconfig librsvg cairo pam polkit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Analyze the compositor's C code, without needing Qt or a GPU.
      - name: Configure Clang static analyzer
        run: >-
          scan-build cmake -S . -B build-static
          -DVELA_BUILD_SHELL=OFF
          -DVELA_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Debug

      - name: Clang Static Analyzer
        run: >-
          scan-build --status-bugs -o scan-reports
          cmake --build build-static --parallel 2

      - name: cppcheck on pure C modules
        shell: bash
        run: |
          cppcheck --std=c17 --enable=warning --error-exitcode=1 \
            --suppress=missingIncludeSystem --suppress=unusedFunction \
            compositor/src/buffer.c compositor/src/color.c \
            compositor/src/config.c compositor/src/frame_clock.c \
            compositor/src/geometry.c compositor/src/legacy_names.c \
            compositor/src/motion.c compositor/src/output_config.c \
            compositor/src/sun.c compositor/src/util.c compositor/src/x11_space.c \
            brightness/src/ddc.c brightness/src/fake.c brightness/src/lines.c \
            brightness/src/scheduler.c brightness/src/transfer.c

      - name: clang-tidy on pure C modules
        shell: bash
        run: |
          clang-tidy -p build-static --quiet \
            --checks='-*,clang-analyzer-core.*,bugprone-sizeof-expression' \
            compositor/src/buffer.c compositor/src/color.c \
            compositor/src/config.c compositor/src/frame_clock.c \
            compositor/src/geometry.c compositor/src/output_config.c \
            compositor/src/sun.c compositor/src/util.c compositor/src/x11_space.c \
            brightness/src/ddc.c brightness/src/fake.c brightness/src/lines.c \
            brightness/src/scheduler.c brightness/src/transfer.c

      - name: Upload analyzer reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-analyzer-reports
          path: scan-reports/
          if-no-files-found: ignore
          retention-days: 14
