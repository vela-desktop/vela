name: Python checks

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint all Python sources
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: '0.17.5'
          args: check --output-format=github
          src: .

  python-minimum:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install CPU test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake dbus-daemon openssh-client

      - name: Scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: Reporter
        run: PYTHONPATH=report python -m unittest discover -s report/tests -v

      - name: Functional harness
        run: PYTHONPATH=tests/functional python -m unittest discover -s tests/harness -v

      - name: Audio metadata parser (CPU-only)
        run: python -m unittest discover -s tests/audio -p 'test_fixture.py' -k DefaultReadTest -v

      - name: Configure and smoke-test standalone reporter
        run: |
          cmake -S . -B build-report-cli \
            -DVELA_BUILD_COMPOSITOR=OFF -DVELA_BUILD_SHELL=OFF \
            -DVELA_BUILD_POLKIT=OFF -DVELA_BUILD_TOOLS=OFF -DVELA_REPORT_GUI=OFF \
            -DPython3_EXECUTABLE="$(command -v python)"
          build-report-cli/report/vela-report --help

      - name: Validate Python syntax
        run: |
          python -m compileall -q compositor/tests packaging report scripts session/tests tests
          python -m py_compile packaging/vela-update-state report/vela-report.in
