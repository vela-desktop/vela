name: OSV dependency scan

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: '9 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Known vulnerable dependencies
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --include-git-root
        --recursive
        ./
