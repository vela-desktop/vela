# Opt-in real-hardware GPU tests. Never run automatically on PRs or pushes.
# The self-hosted runner must have the custom 'vela-nvidia' label.
name: GPU CI - NVIDIA (manual)

on:
  workflow_dispatch:
    inputs:
      collect_coverage:
        description: Collect instrumented GCC coverage from the GPU test suite
        type: boolean
        default: false
      test_native_xwayland:
        description: Run experimental KWin X11 native scaling and monitor refresh tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vela-nvidia-gpu-manual
  cancel-in-progress: false

jobs:
  gpu-nvidia:
    name: NVIDIA functional and sharpness tests
    runs-on: [self-hosted, linux, x64, vela-nvidia]
    timeout-minutes: 90

    steps:
      - name: Checkout selected revision (without persisting credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use an isolated runtime directory rather than a user's Wayland session.
      # Restrict Vulkan to NVIDIA, even on hybrid NVIDIA/Intel laptops.
      - name: Qualify hardware Vulkan (NVIDIA >= 1.4)
        shell: bash
        run: |
          set -euo pipefail
          command -v vulkaninfo >/dev/null || { echo '::error::Install vulkan-tools'; exit 1; }
          command -v python3 >/dev/null || { echo '::error::Install python'; exit 1; }
          command -v cmake >/dev/null || { echo '::error::Install the build dependencies from docs/development.md'; exit 1; }
          command -v ninja >/dev/null || { echo '::error::Install ninja'; exit 1; }
          # Test the default native X11 server, not just the old wlroots XWayland.
          command -v xwayland-satellite >/dev/null || { echo '::error::Install xwayland-satellite >= 0.7 on the GPU runner'; exit 1; }
          command -v xrandr >/dev/null || { echo '::error::Install xorg-xrandr on the GPU runner'; exit 1; }
          python3 -c 'import numpy, PIL' || { echo '::error::Install python-numpy and python-pillow'; exit 1; }

          command -v nvidia-smi >/dev/null || { echo '::error::nvidia-smi unavailable: check the NVIDIA driver'; exit 1; }

          # NVIDIA's proprietary Vulkan ICD should be the only enumerated GPU.
          # Prefer the usual Arch path, with distro-specific fallbacks.
          icd=
          for candidate in \
            /usr/share/vulkan/icd.d/nvidia_icd.json \
            /etc/vulkan/icd.d/nvidia_icd.json \
            /usr/share/vulkan/icd.d/nvidia_icd.x86_64.json \
            /etc/vulkan/icd.d/nvidia_icd.x86_64.json; do
            if [[ -f "$candidate" ]]; then
              icd="$candidate"
              break
            fi
          done
          if [[ -z "$icd" ]]; then
            echo '::error::NVIDIA Vulkan ICD manifest not found; check nvidia-utils and driver installation'
            exit 1
          fi
          echo "Using NVIDIA ICD manifest: $icd"
          runtime="$RUNNER_TEMP/vela-nvidia-xdg"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VELA_GPU_CI_STRICT=1" >> "$GITHUB_ENV"
          # Diagnostic-only counters: no change to GPU test scheduling or assertions.
          echo "VELA_FUNCTIONAL_PROFILE=1" >> "$GITHUB_ENV"
          echo "VELA_GPU_EXPECT_VENDOR=0x10de" >> "$GITHUB_ENV"
          # Thirty Vulkan teardown cycles with validation on actual NVIDIA hardware.
          echo "VELA_SHUTDOWN_STRESS_CYCLES=30" >> "$GITHUB_ENV"
          echo "VELA_SHUTDOWN_VALIDATE=1" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime" VK_DRIVER_FILES="$icd"

          # nvidia-smi alone is not enough: Vela needs an actual NVIDIA
          # DRM render node, not the Intel iGPU's render node.
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader \
            | tee "$RUNNER_TEMP/vela-nvidia-driver.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys

          for render_node in sorted(Path("/dev/dri").glob("renderD*")):
              vendor_file = Path("/sys/class/drm") / render_node.name / "device/vendor"
              try:
                  if vendor_file.read_text().strip().lower() != "0x10de":
                      continue
                  fd = os.open(render_node, os.O_RDWR | os.O_CLOEXEC)
                  os.close(fd)
                  print(f"Accessible NVIDIA DRM render node: {render_node}")
                  break
              except (OSError, ValueError) as exc:
                  print(f"Cannot use {render_node}: {exc}", file=sys.stderr)
          else:
              print("::error::No accessible NVIDIA DRM render node; check nvidia_drm and device permissions",
                    file=sys.stderr)
              sys.exit(1)
          PY

          vulkaninfo --summary | tee "$RUNNER_TEMP/vela-nvidia-vulkan.txt"
          python3 - "$RUNNER_TEMP/vela-nvidia-vulkan.txt" <<'PY'
          import re
          import sys

          report = open(sys.argv[1], encoding="utf-8").read()
          devices = re.split(r"(?m)^\s*GPU\d+:\s*$", report)[1:]
          for device in devices:
              vendor = re.search(r"(?m)^\s*vendorID\s*=\s*0x10de\b", device, re.IGNORECASE)
              version = re.search(r"(?m)^\s*apiVersion\s*=\s*(\d+)\.(\d+)", device)
              driver = re.search(r"(?m)^\s*driverID\s*=\s*DRIVER_ID_NVIDIA_PROPRIETARY\b", device)
              if vendor and driver and version and tuple(map(int, version.groups())) >= (1, 4):
                  print("Hardware NVIDIA proprietary Vulkan >= 1.4 confirmed.")
                  break
          else:
              print("::error::No NVIDIA proprietary Vulkan >= 1.4 device found", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Configure Vela with GPU tests
        shell: bash
        env:
          COLLECT_COVERAGE: ${{ inputs.collect_coverage }}
        run: |
          set -euo pipefail
          extra_flags=(-DCMAKE_BUILD_TYPE=RelWithDebInfo)
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            for tool in gcc g++ gcov gcovr; do
              command -v "$tool" >/dev/null || { echo "::error::Install $tool on the GPU runner for coverage mode"; exit 1; }
            done
            extra_flags=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
              -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
              -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage)
          fi
          cmake -S . -B "$RUNNER_TEMP/vela-gpu-build" -G Ninja \
            "${extra_flags[@]}" \
            -DVELA_BUILD_COMPOSITOR=ON \
            -DVELA_BUILD_SHELL=ON \
            -DVELA_BUILD_TOOLS=ON \
            -DVELA_BUILD_GPU_TEST_TOOLS=ON

      - name: Build exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 8 )); then jobs=8; fi
          cmake --build "$RUNNER_TEMP/vela-gpu-build" --parallel "$jobs"

      - name: Real GPU functional and sharpness suites
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/vela-gpu-build" \
            -L '^gpu$' --output-on-failure \
            --output-junit "$RUNNER_TEMP/vela-nvidia-junit.xml" \
            | tee "$RUNNER_TEMP/vela-nvidia-ctest.log"

      - name: Experimental XWayland native scaling and physical corner repaint
        if: ${{ inputs.test_native_xwayland }}
        shell: bash
        env:
          VELA_ASSERT_KWIN_XWAYLAND: "1"
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/vela-gpu-build" \
            -R '^functional-xwayland-kwin$' --output-on-failure
      - name: Reject skipped or missing GPU tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/vela-nvidia-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          skipped = [case.attrib.get("name", "<unnamed>")
                     for case in cases if case.find("skipped") is not None]
          if not cases:
              print("::error::No GPU tests were executed")
              sys.exit(1)

          names = {case.attrib.get("name", "") for case in cases}
          missing = [name for name in ("sharpness", "sharpness-cpu")
                     if name not in names]
          if not any(name.startswith("functional-") for name in names):
              missing.append("functional-*")
          if missing:
              print("::error::Required GPU suites missing: " + ", ".join(missing))
              sys.exit(1)
          if skipped:
              print("::error::GPU tests skipped: " + ", ".join(skipped))
              sys.exit(1)
          print(f"All {len(cases)} GPU CTest entries were executed (none skipped).")
          PY

      # Generate the report only after all mandatory GPU tests have executed
      # without skips; untrusted pull request code is never auto-dispatched.
      - name: Generate instrumented GPU coverage
        if: inputs.collect_coverage
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/coverage-report.sh "$RUNNER_TEMP/vela-gpu-build" "$RUNNER_TEMP/vela-nvidia-coverage"
          cat "$RUNNER_TEMP/vela-nvidia-coverage/coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve GPU coverage
        if: inputs.collect_coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vela-nvidia-coverage
          path: ${{ runner.temp }}/vela-nvidia-coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Vulkan and CTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vela-nvidia-gpu-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/vela-nvidia-driver.txt
            ${{ runner.temp }}/vela-nvidia-vulkan.txt
            ${{ runner.temp }}/vela-nvidia-ctest.log
            ${{ runner.temp }}/vela-nvidia-junit.xml
            ${{ runner.temp }}/vela-gpu-build/Testing/Temporary/LastTest.log

  publish-nvidia-coverage:
    name: Codecov NVIDIA upload (GitHub hosted)
    needs: [gpu-nvidia]
    if: inputs.collect_coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vela-nvidia-coverage
          path: gpu-coverage
      - name: Ensure Cobertura report is present
        run: test -s gpu-coverage/coverage.xml
      - name: Upload to Codecov for the exact tested SHA
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./gpu-coverage/coverage.xml
          flags: gpu-nvidia
          use_oidc: true
          disable_search: true
          fail_ci_if_error: false
