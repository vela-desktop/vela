# Opt-in real-hardware GPU tests. Never run automatically on PRs or pushes.
# Each run rents a fresh single-GPU Vast.ai container (scripts/vast-runner.py)
# from the image of nvidia-ci-image.yml, and destroys it at the end.
name: GPU CI - NVIDIA (manual)

on:
  workflow_dispatch:
    inputs:
      collect_coverage:
        description: Collect instrumented GCC coverage from the GPU test suite
        type: boolean
        default: false
      record_promo_smoke:
        description: Record and verify isolated promo scenes at 100% and 125% scaling
        type: boolean
        default: false
      tests:
        description: Only the CTest entries matching this regex (e.g. functional-shell); empty runs all
        type: string
        default: ''
      test_filter:
        description: With tests, only the Python test methods whose names contain this (like unittest -k)
        type: string
        default: ''
      gpu:
        description: Rent this GPU (e.g. RTX 3060) instead of the cheapest that fits
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: vela-nvidia-gpu-manual
  cancel-in-progress: false

jobs:
  # The Vast key and the GitHub App that registers runners stay in this
  # environment, on GitHub's machines; the rented one never sees them.
  start-runner:
    name: Rent a Vast.ai GPU
    runs-on: ubuntu-latest
    environment: gpu-nvidia
    timeout-minutes: 65
    outputs:
      gpu: ${{ steps.rent.outputs.gpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Token for the organization's runners
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.VELA_RUNNER_APP_ID }}
          private-key: ${{ secrets.VELA_RUNNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: write
      - name: Rent the cheapest fitting GPU and start a runner on it
        id: rent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          GPU: ${{ inputs.gpu }}
          ORG: ${{ github.repository_owner }}
          LABEL: vela-vast-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          version=$(gh api repos/actions/runner/releases/latest --jq '.tag_name | ltrimstr("v")')
          # The image built from this revision's .github/images/nvidia-ci (see
          # nvidia-ci-image.yml), not whichever was published last. Checked
          # before renting: a missing image would cost a rental.
          tag="tree-$(git rev-parse HEAD:.github/images/nvidia-ci)"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$ORG/vela-ci-nvidia:pull" | jq -r .token)
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$ORG/vela-ci-nvidia/manifests/$tag" \
            || { echo "::error::No vela-ci-nvidia:$tag yet: run nvidia-ci-image.yml on this revision first"; exit 1; }
          python3 scripts/vast-runner.py start --org "$ORG" --label "$LABEL" --gpu "$GPU" \
            --image "ghcr.io/$ORG/vela-ci-nvidia:$tag" --runner-version "$version" --max-price 0.12

  gpu-nvidia:
    name: NVIDIA functional and sharpness tests
    needs: start-runner
    runs-on: vela-vast-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 90

    steps:
      - name: Rented GPU
        env:
          GPU: ${{ needs.start-runner.outputs.gpu }}
        run: echo "Rented on Vast.ai - $GPU" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Checkout selected revision (without persisting credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use an isolated runtime directory rather than a user's Wayland session.
      # Restrict Vulkan to NVIDIA, even on hybrid NVIDIA/Intel laptops.
      - name: Qualify hardware Vulkan (NVIDIA >= 1.4)
        shell: bash
        run: |
          set -euo pipefail
          command -v vulkaninfo >/dev/null || { echo '::error::Install vulkan-tools'; exit 1; }
          command -v python3 >/dev/null || { echo '::error::Install python'; exit 1; }
          command -v cmake >/dev/null || { echo '::error::Install the build dependencies from docs/development.md'; exit 1; }
          command -v ninja >/dev/null || { echo '::error::Install ninja'; exit 1; }
          python3 -c 'import numpy, PIL' || { echo '::error::Install python-numpy and python-pillow'; exit 1; }
          # Strict GPU CI rejects the X11 native-resolution tests if these are
          # missing (Arch: xorg-xwayland, xorg-xrandr, xorg-xrdb, xorg-xprop).
          for tool in Xwayland xrandr xrdb xprop; do
            command -v "$tool" >/dev/null || { echo "::error::Install $tool on the NVIDIA runner"; exit 1; }
          done

          command -v nvidia-smi >/dev/null || { echo '::error::nvidia-smi unavailable: check the NVIDIA driver'; exit 1; }

          # NVIDIA's proprietary Vulkan ICD should be the only enumerated GPU.
          # The NVIDIA container toolkit puts it in /etc; the others are
          # where distribution packages install it.
          icd=
          for candidate in \
            /usr/share/vulkan/icd.d/nvidia_icd.json \
            /etc/vulkan/icd.d/nvidia_icd.json \
            /usr/share/vulkan/icd.d/nvidia_icd.x86_64.json \
            /etc/vulkan/icd.d/nvidia_icd.x86_64.json; do
            if [[ -f "$candidate" ]]; then
              icd="$candidate"
              break
            fi
          done
          if [[ -z "$icd" ]]; then
            echo '::error::NVIDIA Vulkan ICD manifest not found; check nvidia-utils and driver installation'
            exit 1
          fi
          echo "Using NVIDIA ICD manifest: $icd"
          runtime="$RUNNER_TEMP/vela-nvidia-xdg"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VELA_GPU_CI_STRICT=1" >> "$GITHUB_ENV"
          # Diagnostic-only counters: no change to GPU test scheduling or assertions.
          echo "VELA_FUNCTIONAL_PROFILE=1" >> "$GITHUB_ENV"
          echo "VELA_GPU_EXPECT_VENDOR=0x10de" >> "$GITHUB_ENV"
          # Rented hosts have slow server CPUs: tests wait three times longer
          # and capture throughput floors are skipped (the AMD runner checks them).
          echo "VELA_TEST_TIME_SCALE=3" >> "$GITHUB_ENV"
          # Thirty Vulkan teardown cycles with validation on actual NVIDIA hardware.
          echo "VELA_SHUTDOWN_STRESS_CYCLES=30" >> "$GITHUB_ENV"
          echo "VELA_SHUTDOWN_VALIDATE=1" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime" VK_DRIVER_FILES="$icd"

          # nvidia-smi alone is not enough: Vela needs an actual NVIDIA
          # DRM render node, not the Intel iGPU's render node.
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader \
            | tee "$RUNNER_TEMP/vela-nvidia-driver.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys

          for render_node in sorted(Path("/dev/dri").glob("renderD*")):
              vendor_file = Path("/sys/class/drm") / render_node.name / "device/vendor"
              try:
                  if vendor_file.read_text().strip().lower() != "0x10de":
                      continue
                  fd = os.open(render_node, os.O_RDWR | os.O_CLOEXEC)
                  os.close(fd)
                  print(f"Accessible NVIDIA DRM render node: {render_node}")
                  break
              except (OSError, ValueError) as exc:
                  print(f"Cannot use {render_node}: {exc}", file=sys.stderr)
          else:
              print("::error::No accessible NVIDIA DRM render node; check nvidia_drm and device permissions",
                    file=sys.stderr)
              sys.exit(1)
          PY

          vulkaninfo --summary | tee "$RUNNER_TEMP/vela-nvidia-vulkan.txt"
          python3 - "$RUNNER_TEMP/vela-nvidia-vulkan.txt" <<'PY'
          import re
          import sys

          report = open(sys.argv[1], encoding="utf-8").read()
          devices = re.split(r"(?m)^\s*GPU\d+:\s*$", report)[1:]
          for device in devices:
              vendor = re.search(r"(?m)^\s*vendorID\s*=\s*0x10de\b", device, re.IGNORECASE)
              version = re.search(r"(?m)^\s*apiVersion\s*=\s*(\d+)\.(\d+)", device)
              driver = re.search(r"(?m)^\s*driverID\s*=\s*DRIVER_ID_NVIDIA_PROPRIETARY\b", device)
              if vendor and driver and version and tuple(map(int, version.groups())) >= (1, 4):
                  print("Hardware NVIDIA proprietary Vulkan >= 1.4 confirmed.")
                  break
          else:
              print("::error::No NVIDIA proprietary Vulkan >= 1.4 device found", file=sys.stderr)
              sys.exit(1)
          PY

          # Qt's windows must draw with NVIDIA's EGL, as for NVIDIA's users.
          ls /usr/share/glvnd/egl_vendor.d /usr/share/egl/egl_external_platform.d
          test -e /usr/share/glvnd/egl_vendor.d/10_nvidia.json \
            || { echo "::error::NVIDIA's EGL isn't registered with glvnd"; exit 1; }
          ls /usr/share/egl/egl_external_platform.d | grep -q wayland \
            || { echo "::error::No EGL Wayland platform for NVIDIA (egl-wayland)"; exit 1; }
          # Only NVIDIA's: glvnd would otherwise fall back on Mesa's EGL in
          # software, silently, whenever NVIDIA's can't draw.
          vendor=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
          echo "__EGL_VENDOR_LIBRARY_FILENAMES=$vendor" >> "$GITHUB_ENV"
          # Qt's errors and its GL renderer in the test logs, not in a journal
          # the container doesn't have.
          echo "QT_FORCE_STDERR_LOGGING=1" >> "$GITHUB_ENV"
          echo "QSG_INFO=1" >> "$GITHUB_ENV"
          ls -l /dev/dri /dev/nvidia* || true
          # egl-wayland finds the compositor's GPU among NVIDIA's EGL devices
          # by its DRM nodes: without them, Qt gets no EGL display.
          __EGL_VENDOR_LIBRARY_FILENAMES=$vendor python3 - <<'PY'
          import ctypes
          import os
          from pathlib import Path
          import sys

          egl = ctypes.CDLL("libEGL.so.1")
          gbm = ctypes.CDLL("libgbm.so.1")
          egl.eglGetProcAddress.restype = ctypes.c_void_p
          egl.eglGetProcAddress.argtypes = [ctypes.c_char_p]
          egl.eglQueryString.restype = ctypes.c_char_p
          egl.eglQueryString.argtypes = [ctypes.c_void_p, ctypes.c_int]
          egl.eglGetPlatformDisplay.restype = ctypes.c_void_p
          egl.eglGetPlatformDisplay.argtypes = [ctypes.c_uint, ctypes.c_void_p, ctypes.c_void_p]
          egl.eglInitialize.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p]
          egl.eglGetError.restype = ctypes.c_int
          gbm.gbm_create_device.restype = ctypes.c_void_p

          extensions = (egl.eglQueryString(None, 0x3055) or b"").decode().split()
          print("EGL client extensions:", *extensions)
          if not {"EGL_KHR_platform_wayland", "EGL_EXT_platform_wayland"} & set(extensions):
              sys.exit("::error::NVIDIA's EGL has no Wayland platform: Qt's windows can't draw")
          query_devices = ctypes.CFUNCTYPE(ctypes.c_uint, ctypes.c_int, ctypes.POINTER(ctypes.c_void_p),
                                           ctypes.POINTER(ctypes.c_int))(egl.eglGetProcAddress(b"eglQueryDevicesEXT"))
          device_string = ctypes.CFUNCTYPE(ctypes.c_char_p, ctypes.c_void_p, ctypes.c_int)(
              egl.eglGetProcAddress(b"eglQueryDeviceStringEXT"))
          devices = (ctypes.c_void_p * 16)()
          count = ctypes.c_int(0)
          query_devices(16, devices, ctypes.byref(count))
          nodes = set()
          for device in devices[:count.value]:
              card, render = device_string(device, 0x3233), device_string(device, 0x3377)
              print(f"EGL device: {card} {render} {device_string(device, 0x3055)}")
              nodes.add(render)

          node = next((n for n in sorted(Path("/dev/dri").glob("renderD*"))
                       if (Path("/sys/class/drm") / n.name / "device/vendor").read_text().strip() == "0x10de"), None)
          if node is None:
              sys.exit("::error::No NVIDIA render node")
          display = egl.eglGetPlatformDisplay(0x31D7, gbm.gbm_create_device(os.open(node, os.O_RDWR | os.O_CLOEXEC)), None)
          if not display or not egl.eglInitialize(display, None, None):
              sys.exit(f"::error::NVIDIA's EGL doesn't start on {node} (EGL error {egl.eglGetError():#x})")
          print(f"EGL on {node}: {egl.eglQueryString(display, 0x3053).decode()}")
          if str(node).encode() not in nodes:
              sys.exit(f"::error::No NVIDIA EGL device has {node}: egl-wayland can't find the compositor's GPU")
          PY

          # Buffers come from GBM: with Mesa's backend instead of NVIDIA's,
          # every allocation fails and so does every test.
          python3 - <<'PY'
          import ctypes
          import os
          from pathlib import Path
          import sys

          gbm = ctypes.CDLL("libgbm.so.1")
          gbm.gbm_create_device.restype = ctypes.c_void_p
          gbm.gbm_device_get_backend_name.argtypes = [ctypes.c_void_p]
          gbm.gbm_device_get_backend_name.restype = ctypes.c_char_p
          for node in sorted(Path("/dev/dri").glob("renderD*")):
              if (Path("/sys/class/drm") / node.name / "device/vendor").read_text().strip() == "0x10de":
                  device = gbm.gbm_create_device(os.open(node, os.O_RDWR | os.O_CLOEXEC))
                  name = gbm.gbm_device_get_backend_name(device).decode() if device else "none"
                  print(f"GBM backend on {node}: {name}")
                  sys.exit(0 if name == "nvidia" else "::error::GBM doesn't use NVIDIA's backend")
          sys.exit("::error::No NVIDIA render node for GBM")
          PY

          # The dmabuf extensions the renderer requires (compositor/src/render/vulkan.c):
          # some drivers leave them out, and every test would fail at start.
          vulkaninfo > "$RUNNER_TEMP/vela-nvidia-vulkan-full.txt" 2>/dev/null || true
          for ext in VK_EXT_image_drm_format_modifier VK_KHR_external_memory_fd VK_EXT_external_memory_dma_buf \
                     VK_EXT_queue_family_foreign VK_KHR_external_semaphore_fd VK_EXT_physical_device_drm; do
            grep -q "$ext" "$RUNNER_TEMP/vela-nvidia-vulkan-full.txt" \
              || { echo "::error::NVIDIA Vulkan here lacks $ext, which Vela needs"; exit 1; }
          done

      - name: Configure Vela with GPU tests
        shell: bash
        env:
          COLLECT_COVERAGE: ${{ inputs.collect_coverage }}
        run: |
          set -euo pipefail
          extra_flags=(-DCMAKE_BUILD_TYPE=RelWithDebInfo)
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            for tool in gcc g++ gcov gcovr; do
              command -v "$tool" >/dev/null || { echo "::error::Install $tool on the GPU runner for coverage mode"; exit 1; }
            done
            # Tests skip their throughput floors in an instrumented build.
            echo "VELA_GPU_COVERAGE=1" >> "$GITHUB_ENV"
            extra_flags=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
              -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
              -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage)
          fi
          cmake -S . -B "$RUNNER_TEMP/vela-gpu-build" -G Ninja \
            "${extra_flags[@]}" \
            -DVELA_BUILD_COMPOSITOR=ON \
            -DVELA_BUILD_SHELL=ON \
            -DVELA_BUILD_TOOLS=ON \
            -DVELA_BUILD_GPU_TEST_TOOLS=ON

      - name: Build exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 8 )); then jobs=8; fi
          cmake --build "$RUNNER_TEMP/vela-gpu-build" --parallel "$jobs"

      - name: Real GPU functional and sharpness suites
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
          VELA_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          if [[ -n "$VELA_TEST_FILTER" && -z "$TESTS" ]]; then
            echo '::error::test_filter needs tests too, to pick the suite it filters'
            exit 1
          fi
          only=()
          if [[ -n "$TESTS" ]]; then only=(-R "$TESTS"); fi
          ctest --test-dir "$RUNNER_TEMP/vela-gpu-build" \
            -L '^gpu$' "${only[@]}" --output-on-failure \
            --output-junit "$RUNNER_TEMP/vela-nvidia-junit.xml" \
            | tee "$RUNNER_TEMP/vela-nvidia-ctest.log"

      - name: Reject skipped or missing GPU tests
        shell: bash
        env:
          PARTIAL: ${{ inputs.tests != '' || inputs.test_filter != '' }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/vela-nvidia-junit.xml" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          skipped = [case.attrib.get("name", "<unnamed>")
                     for case in cases if case.find("skipped") is not None]
          if not cases:
              print("::error::No GPU tests were executed")
              sys.exit(1)

          names = {case.attrib.get("name", "") for case in cases}
          missing = [name for name in ("sharpness", "sharpness-cpu")
                     if name not in names]
          if not any(name.startswith("functional-") for name in names):
              missing.append("functional-*")
          # test_filter applies only to functional-* entries: on sharpness
          # alone it would be ignored, and the run would pass without it.
          if os.environ["TEST_FILTER"] and not any(name.startswith("functional-") for name in names):
              print("::error::test_filter selected no functional test: tests must pick a functional-* entry")
              sys.exit(1)
          # A partial run, asked for by name, needs only what it selected.
          if missing and os.environ["PARTIAL"] != "true":
              print("::error::Required GPU suites missing: " + ", ".join(missing))
              sys.exit(1)
          if skipped:
              print("::error::GPU tests skipped: " + ", ".join(skipped))
              sys.exit(1)
          print(f"All {len(cases)} GPU CTest entries were executed (none skipped).")
          PY

      # Generate the report only after all mandatory GPU tests have executed
      # without skips; untrusted pull request code is never auto-dispatched.
      # Explicitly opt in to video encoding: raw frames can use substantial disk.
      - name: Smoke test real promo capture (100% and 125% scaling)
        if: inputs.record_promo_smoke
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          for required in ffmpeg ffprobe dbus-daemon pipewire wireplumber pw-cat pw-dump unshare; do
            command -v "$required" >/dev/null || { echo "::error::Missing promo dependency: $required"; exit 1; }
          done
          for scale in 1.0 1.25; do
            out="$RUNNER_TEMP/vela-promo-smoke-$scale"
            /usr/bin/python3 scripts/record-promo.py desktop start-menu snap-assist \
              --build "$RUNNER_TEMP/vela-gpu-build" \
              --out "$out" --resolution 1280x720 --scale "$scale" --fps 30 --no-reel
            /usr/bin/python3 scripts/verify-promo.py --out "$out" desktop start-menu snap-assist
            # Do not retain massive frames or footage on a self-hosted runner.
            rm -rf -- "$out"
          done

      - name: Generate instrumented GPU coverage
        if: inputs.collect_coverage && inputs.tests == '' && inputs.test_filter == ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/coverage-report.sh "$RUNNER_TEMP/vela-gpu-build" "$RUNNER_TEMP/vela-nvidia-coverage"
          cat "$RUNNER_TEMP/vela-nvidia-coverage/coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve GPU coverage
        if: inputs.collect_coverage && inputs.tests == '' && inputs.test_filter == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vela-nvidia-coverage
          path: ${{ runner.temp }}/vela-nvidia-coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Vulkan and CTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vela-nvidia-gpu-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/vela-nvidia-driver.txt
            ${{ runner.temp }}/vela-nvidia-vulkan.txt
            ${{ runner.temp }}/vela-nvidia-ctest.log
            ${{ runner.temp }}/vela-nvidia-junit.xml
            ${{ runner.temp }}/vela-gpu-build/Testing/Temporary/LastTest.log

  stop-runner:
    name: Destroy the Vast.ai GPU
    needs: [start-runner, gpu-nvidia]
    if: always()
    runs-on: ubuntu-latest
    environment: gpu-nvidia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Token for the organization's runners
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.VELA_RUNNER_APP_ID }}
          private-key: ${{ secrets.VELA_RUNNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: write
      - name: Destroy every instance and runner of this run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          ORG: ${{ github.repository_owner }}
          LABEL: vela-vast-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/vast-runner.py stop --org "$ORG" --label "$LABEL"

  publish-nvidia-coverage:
    name: Codecov NVIDIA upload (GitHub hosted)
    needs: [gpu-nvidia]
    if: inputs.collect_coverage && inputs.tests == '' && inputs.test_filter == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vela-nvidia-coverage
          path: gpu-coverage
      - name: Ensure Cobertura report is present
        run: test -s gpu-coverage/coverage.xml
      - name: Upload to Codecov for the exact tested SHA
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./gpu-coverage/coverage.xml
          flags: gpu-nvidia
          use_oidc: true
          disable_search: true
          fail_ci_if_error: false
