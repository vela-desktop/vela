# Re-evaluate every open PR when main or a PR changes. The privileged event
# reads GitHub API metadata only; never check out or run untrusted PR code.
name: Path-aware branch freshness

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

# One shared queue for push and PR events. Every run checks every open PR.
concurrency:
  group: vela-branch-freshness-main
  cancel-in-progress: false

jobs:
  freshness:
    name: Check relevant base changes
    runs-on: ubuntu-latest
    steps:
      - name: Recheck open pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const statusContext = 'branch-freshness/relevant-base';
            const targetUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const isIgnorable = path =>
              /^(README|CONTRIBUTING|SECURITY)\.md$/.test(path) ||
              path.startsWith('docs/');
            // GitHub keeps at most 1000 statuses per commit and context, and
            // every run visits every open PR: publish only what changes the
            // latest status, or a PR left alone stops accepting statuses.
            const latestStatus = async sha => {
              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner, repo, ref: sha, per_page: 100
              });
              return data.find(status => status.context === statusContext);
            };
            const publish = async (sha, state, description, latest) => {
              description = description.slice(0, 140);
              if (latest?.state === state && latest?.description === description) return latest;
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, state, context: statusContext,
                description, target_url: targetUrl
              });
              return { state, description };
            };
            const blocks = status => status?.state === 'failure' || status?.state === 'error';
            
            // Every run scans all PRs: GitHub may replace a pending push run
            // with a PR run when both share this concurrency group.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100
            });
            let errors = 0;
            let unreportedErrors = 0;
            for (const candidate of prs) {
              // The list response can still identify HEAD if a later PR read fails.
              let headSha = candidate.head?.sha;
              let mergeSha;
              let headStatus;
              let mergeStatus;
              try {
                const { data: first } = await github.rest.pulls.get({
                  owner, repo, pull_number: candidate.number
                });
                if (first.state !== 'open' || first.base.ref !== 'main') continue;
                headSha = first.head.sha;
            
                // Invalidate any previous HEAD success before evaluating the new base.
                // Always replace this pending state with a terminal status below.
                headStatus = await latestStatus(headSha);
                if (headStatus?.state === 'success') {
                  headStatus = await publish(headSha, 'pending', 'Evaluating current base', headStatus);
                }
            
                const { data: main } = await github.rest.repos.getBranch({
                  owner, repo, branch: 'main'
                });
                const baseSha = main.commit.sha;
            
                // Compare from the common ancestor to main, excluding PR-only changes.
                const { data: diff } = await github.rest.repos.compareCommits({
                  owner, repo, base: headSha, head: baseSha
                });
                let state = 'failure';
                let description;
                if (diff.ahead_by === 0) {
                  state = 'success';
                  description = 'Branch includes current main';
                } else if (!Number.isInteger(diff.ahead_by) ||
                           !Array.isArray(diff.files) || diff.files.length >= 300) {
                  description = 'Base comparison incomplete; update branch';
                } else {
                  const relevant = diff.files.filter(file =>
                    !isIgnorable(file.filename) ||
                    (file.previous_filename && !isIgnorable(file.previous_filename))
                  );
                  if (relevant.length === 0) {
                    state = 'success';
                    description = 'Only documentation changed on main';
                  } else {
                    // No count here: it changes with every push to main.
                    description = 'Update branch: main changed relevant files';
                    core.info('PR #' + candidate.number + ': ' + relevant.length + ' relevant file(s) changed');
                  }
                }
            
                // Do not publish a verdict for a superseded PR or base snapshot.
                const [{ data: latestMain }, { data: latestPr }] = await Promise.all([
                  github.rest.repos.getBranch({ owner, repo, branch: 'main' }),
                  github.rest.pulls.get({ owner, repo, pull_number: candidate.number })
                ]);
                if (latestMain.commit.sha !== baseSha ||
                    latestPr.head.sha !== headSha ||
                    latestPr.state !== 'open' || latestPr.base.ref !== 'main') {
                  throw new Error('Main or PR head moved during evaluation');
                }
                // GitHub may evaluate HEAD or the synthetic merge. The latter
                // is tied to the verified base SHA; HEAD alone is NOT a freshness
                // guarantee after main changes. Require up-to-date branches or
                // a merge queue in repository protection to close that race.
                // Compare HEAD independently; a synthetic merge may be missing or stale.
                // Never report success on a merge commit without verifying its parents.
                // A null mergeability result means GitHub is still computing it.
                // Retry one read without sleeping; do not declare conflict-free success
                // until GitHub has actually evaluated mergeability.
                let currentPr = latestPr;
                if (currentPr.mergeable == null) {
                  const { data: refreshedPr } = await github.rest.pulls.get({
                    owner, repo, pull_number: candidate.number
                  });
                  if (refreshedPr.head.sha !== headSha ||
                      refreshedPr.state !== 'open' || refreshedPr.base.ref !== 'main') {
                    throw new Error('Pull request changed during mergeability refresh');
                  }
                  currentPr = refreshedPr;
                }
                if (currentPr.mergeable === false) {
                  state = 'failure';
                  description = 'Merge conflict with main; resolve conflicts';
                  core.warning('PR #' + candidate.number + ': merge conflict; GitHub blocks merge');
                } else if (currentPr.mergeable !== true) {
                  // A known stale branch must remain failed; only an otherwise
                  // successful freshness verdict needs to wait for mergeability.
                  if (state === 'success') {
                    state = 'error';
                    description = 'Mergeability not yet known; retry check';
                  }
                  core.warning('PR #' + candidate.number + ': mergeability still unknown');
                }
                if (currentPr.mergeable === true && currentPr.merge_commit_sha) {
                  try {
                    const { data: merge } = await github.rest.git.getCommit({
                      owner, repo, commit_sha: currentPr.merge_commit_sha
                    });
                    if (merge.parents?.length === 2 &&
                        merge.parents[0].sha === baseSha &&
                        merge.parents[1].sha === headSha) {
                      mergeSha = currentPr.merge_commit_sha;
                    } else {
                      core.info('PR #' + candidate.number + ': synthetic merge has stale parents; checking HEAD only');
                    }
                  } catch (error) {
                    // 404 means the optional synthetic commit is missing.
                    // Other errors (including 422) are not proof of absence.
                    if (error.status !== 404) {
                      // This SHA is for error reporting only, never a success verdict.
                      mergeSha = currentPr.merge_commit_sha;
                      throw error;
                    }
                    core.info('PR #' + candidate.number + ': synthetic merge unavailable; checking HEAD only');
                  }
                }
                headStatus = await publish(headSha, state, description, headStatus);
                if (mergeSha) {
                  mergeStatus = await latestStatus(mergeSha);
                  mergeStatus = await publish(mergeSha, state, description, mergeStatus);
                }
                core.info('PR #' + candidate.number + ': ' + state + ': ' + description);
              } catch (error) {
                errors++;
                core.warning('PR #' + candidate.number + ': ' + error.message);
                // Fail closed per PR. A workflow success is only safe if the
                // affected HEAD (and any known merge) received an error status,
                // or already carries a failure or error from an earlier verdict.
                const failedStatuses = [];
                const known = new Map([[headSha, headStatus], [mergeSha, mergeStatus]]);
                for (const sha of [...new Set([headSha, mergeSha].filter(Boolean))]) {
                  if (blocks(known.get(sha))) continue;
                  try {
                    await publish(sha, 'error', 'Freshness check failed; retry');
                  } catch (statusError) {
                    failedStatuses.push(sha);
                    core.error('PR #' + candidate.number + ': cannot publish error on ' +
                      sha + ': ' + statusError.message);
                  }
                }
                if (!headSha || failedStatuses.length) {
                  unreportedErrors++;
                  core.error('PR #' + candidate.number +
                    ': fail-closed status could not be recorded');
                }
              }
            }
            if (errors) core.warning(errors + ' PR freshness evaluation(s) failed');
            if (unreportedErrors) core.setFailed(unreportedErrors +
              ' PR(s) could not receive fail-closed error statuses');
