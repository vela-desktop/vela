name: Documentation checks

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/fedora.yml'
      - 'scripts/check-docs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate local Markdown links, anchors and build dependency lists
        run: python3 scripts/check-docs.py

      # Temporary read-only diagnostic; remove after fixing SonarCloud findings.
      - name: Diagnose public SonarCloud PR findings
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          args = urllib.parse.urlencode({
              "componentKeys": "vela-desktop_vela",
              "pullRequest": os.environ["PR_NUMBER"],
              "resolved": "false",
              "ps": "100",
          })
          url = "https://sonarcloud.io/api/issues/search?" + args
          try:
              with urllib.request.urlopen(url, timeout=25) as response:
                  data = json.load(response)
              print("SONAR_DIAGNOSTIC_TOTAL:", data.get("total"), flush=True)
              for issue in data.get("issues", []):
                  info = {
                      "key": issue.get("key"), "rule": issue.get("rule"),
                      "message": issue.get("message"), "component": issue.get("component"),
                      "line": issue.get("line"), "type": issue.get("type"),
                      "severity": issue.get("severity"), "impacts": issue.get("impacts"),
                  }
                  print("SONAR_DIAGNOSTIC_ISSUE:", json.dumps(info), flush=True)
          except Exception as exc:
              print("SONAR_DIAGNOSTIC_UNAVAILABLE:", type(exc).__name__, str(exc), flush=True)
          PY
