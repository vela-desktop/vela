name: Documentation checks

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/fedora.yml'
      - 'scripts/check-docs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate local Markdown links, anchors and build dependency lists
        run: python3 scripts/check-docs.py

      - name: Diagnose SonarQube PR findings (temporary, public API)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from urllib import request
          url = ("https://sonarcloud.io/api/issues/search?"
                 "componentKeys=vela-desktop_vela&pullRequest=213&resolved=false&ps=100")
          try:
              with request.urlopen(url, timeout=15) as response:
                  data = json.load(response)
              for issue in data.get("issues", []):
                  location = issue.get("textRange") or {}
                  print("SONAR_FINDING", json.dumps({
                      "rule": issue.get("rule"), "message": issue.get("message"),
                      "component": issue.get("component"), "line": location.get("startLine"),
                      "type": issue.get("type"), "severity": issue.get("severity"),
                      "impacts": issue.get("impacts"),
                  }, sort_keys=True))
              print("SONAR_TOTAL", data.get("total"))
          except Exception as error:
              print("SONAR_DIAGNOSTIC_UNAVAILABLE", str(error))
          PY
