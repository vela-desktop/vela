name: Fedora Build

# Called by build.yml on PRs and main pushes, gating public releases.
# Can also be run independently for debugging without duplicating PR jobs.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Fedora 44
    runs-on: ubuntu-latest
    container: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # official Docker Fedora 44 OCI image index, pinned intentionally
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-fedora
      CCACHE_MAXSIZE: 350M
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          git cmake ninja-build ccache gcc gcc-c++ pkgconf-pkg-config
          glslc vulkan-headers vulkan-loader-devel
          wayland-devel wayland-protocols-devel wlroots-devel
          libxkbcommon-devel pixman-devel libinput-devel libdrm-devel
          mesa-libgbm-devel freetype-devel harfbuzz-devel fontconfig-devel
          librsvg2-devel cairo-devel zlib-devel pam-devel polkit-devel
          qt6-qtbase-devel qt6-qtbase-private-devel
          qt6-qtdeclarative-devel qt6-qtsvg-devel
          qt6-qtwayland-devel qt6-qttools-devel layer-shell-qt-devel
          gtest-devel python3 dbus-daemon shared-mime-info
          pipewire-devel wireplumber-devel pipewire pipewire-utils wireplumber systemd-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Fedora compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-fedora
          key: ccache-fedora44-relwithdebinfo-v1-${{ github.sha }}
          restore-keys: |
            ccache-fedora44-relwithdebinfo-v1-

      - name: Configure
        run: >-
          cmake -S . -B build-fedora -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build-fedora --parallel 2
      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi


      - name: CPU-only tests
        id: audio_cpu_tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The packaging-tests job in Build owns the updater suite for
          # PRs and main pushes. Its Arch-oriented mocks cannot be re-run
          # against Fedora's native RPM/DNF backend.
          # Fedora's RPM smoke job exercises actual DNF transactions.
          # The GPU-labelled tests (functional-*, sharpness) need a GPU.
          ctest --test-dir build-fedora --output-on-failure --parallel 2 -LE gpu -E '^packaging-update$'

      - name: Stress-test remembered audio output (diagnostic, non-blocking)
        # Run on successful AND failed ordinary tests. Do not mask the required
        # CTest result or make this intermittent-bug investigation a release gate.
        if: always() && steps.audio_cpu_tests.outcome != 'skipped'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -uo pipefail
          test -x build-fedora/tests/audio/vela-audio-core-test || exit 0
          dnf install -y gdb binutils
          # Each invocation creates a fresh, private PipeWire/WirePlumber fixture.
          # GDB runs the targeted Qt test, prints every thread on SIGSEGV,
          # and exits. The outer loop does not hide failures in its summary.
          failures=0
          for attempt in $(seq 1 6); do
            echo "::group::remembered output / attempt ${attempt}"
            log=$(mktemp)
            timeout 120s python3 tests/audio/fixture.py -- \
              gdb --quiet --batch \
                -ex 'set pagination off' \
                -ex 'set print thread-events off' \
                -ex 'handle SIGSEGV stop print nopass' \
                -ex 'run' \
                -ex 'thread apply all bt 30' \
                -ex 'info registers' \
                --args build-fedora/tests/audio/vela-audio-core-test chosenOutputIsRemembered \
              2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            if grep -Eq 'Program received signal SIG(SEGV|ABRT)|Inferior.*exited with code [1-9]|ptrace: Operation not permitted' "$log"; then
              echo "Crash, abnormal exit or unavailable ptrace detected"
              rc=1
            fi
            rm -f "$log"
            if (( rc != 0 )); then
              echo "Diagnostic attempt ${attempt} exited ${rc}"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo "Diagnostic attempts: 6, failures/crashes: ${failures}"
          # A reproduction should be visible as a diagnostic-step failure,
          # not make the otherwise successful Fedora build fail.
          (( failures == 0 ))
