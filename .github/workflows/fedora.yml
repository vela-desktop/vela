name: Fedora Build

# PR validation only; post-merge build and packaging run in build.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Fedora 45
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          git cmake ninja-build gcc gcc-c++ pkgconf-pkg-config
          glslc vulkan-headers vulkan-loader-devel
          wayland-devel wayland-protocols-devel wlroots-devel
          libxkbcommon-devel pixman-devel libinput-devel libdrm-devel
          mesa-libgbm-devel freetype-devel harfbuzz-devel fontconfig-devel
          librsvg2-devel cairo-devel zlib-devel pam-devel polkit-devel
          qt6-qtbase-devel qt6-qtbase-private-devel
          qt6-qtdeclarative-devel qt6-qtsvg-devel
          qt6-qtwayland-devel qt6-qttools-devel layer-shell-qt-devel
          gtest-devel python3 dbus-daemon

      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build-fedora -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build-fedora --parallel 2

      - name: CPU-only tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir build-fedora --output-on-failure --parallel 2
          -E '^(functional|sharpness)$'
