name: Fedora Build

# Called by build.yml on PRs and main pushes, gating public releases.
# Can also be run independently for debugging without duplicating PR jobs.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Fedora 44
    runs-on: ubuntu-latest
    container: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # official Docker Fedora 44 OCI image index, pinned intentionally
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-fedora
      CCACHE_MAXSIZE: 350M
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          git cmake ninja-build ccache gcc gcc-c++ pkgconf-pkg-config
          glslc vulkan-headers vulkan-loader-devel
          wayland-devel wayland-protocols-devel wlroots-devel
          libxkbcommon-devel pixman-devel libinput-devel libdrm-devel
          mesa-libgbm-devel freetype-devel harfbuzz-devel fontconfig-devel
          librsvg2-devel cairo-devel zlib-devel pam-devel polkit-devel
          qt6-qtbase-devel qt6-qtbase-private-devel
          qt6-qtdeclarative-devel qt6-qtsvg-devel
          qt6-qtwayland-devel qt6-qttools-devel layer-shell-qt-devel
          gtest-devel python3 dbus-daemon shared-mime-info
          pipewire-devel wireplumber-devel pipewire pipewire-utils wireplumber systemd-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Fedora compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-fedora
          key: ccache-fedora44-relwithdebinfo-v1-${{ github.sha }}
          restore-keys: |
            ccache-fedora44-relwithdebinfo-v1-

      - name: Configure
        run: >-
          cmake -S . -B build-fedora -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build-fedora --parallel 2
      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi


      - name: CPU-only tests
        id: audio_cpu_tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The packaging-tests job in Build owns the updater suite for
          # PRs and main pushes. Its Arch-oriented mocks cannot be re-run
          # against Fedora's native RPM/DNF backend.
          # Fedora's RPM smoke job exercises actual DNF transactions.
          # The GPU-labelled tests (functional-*, sharpness) need a GPU.
          ctest --test-dir build-fedora --output-on-failure --parallel 2 -LE gpu -E '^packaging-update$'

      - name: Compare isolated and full audio-core runs (diagnostic, non-blocking)
        if: always() && steps.audio_cpu_tests.outcome != 'skipped'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          VELA_AUDIO_DIAGNOSTICS: '1'
          VELA_AUDIO_FAKE_STREAM: ${{ github.workspace }}/build-fedora/tests/audio/vela-audio-fake-stream
          VELA_AUDIO_FAKE_DEVICE: ${{ github.workspace }}/build-fedora/tests/audio/vela-audio-fake-device
          VELA_AUDIO_HARNESS_DIAGNOSTICS: '1'
        run: |
          set -uo pipefail
          test -x build-fedora/tests/audio/vela-audio-core-test || exit 0
          dnf install -y gdb binutils
          echo "CTest audio-core registered command and environment:"
          ctest --test-dir build-fedora -N -V -R '^audio-core
          assertions=0
          crashes=0
          timeouts=0
          other_errors=0

          # All three modes get new independent private audio fixtures.
          # Repeat the isolated tests to expose order/timing differences.
          for mode in isolated isolated-gdb full-suite; do
            for attempt in 1 2 3; do
              echo "::group::audio investigation / ${mode} / attempt ${attempt}"
              log=$(mktemp)
              if [[ "${mode}" == isolated-gdb ]]; then
                args=(gdb --quiet --batch
                  -ex 'set pagination off'
                  -ex 'set print thread-events off'
                  -ex 'handle SIGSEGV stop print nopass'
                  -ex run
                  -ex 'thread apply all bt 30'
                  -ex 'info registers'
                  --args build-fedora/tests/audio/vela-audio-core-test chosenOutputIsRemembered)
              elif [[ "${mode}" == isolated ]]; then
                args=(build-fedora/tests/audio/vela-audio-core-test chosenOutputIsRemembered)
              else
                args=(build-fedora/tests/audio/vela-audio-core-test)
              fi
              # Do not let bash -e terminate the stress-test early.
              set +e
              timeout 150s python3 tests/audio/fixture.py -- "${args[@]}" 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
              set -e
              if grep -Eq 'Program received signal SIG(SEGV|ABRT|BUS|ILL)|Received signal 11|SIGSEGV|SIGABRT' "$log"; then
                outcome=crash; crashes=$((crashes + 1))
              elif (( rc == 124 || rc == 137 )); then
                outcome=timeout; timeouts=$((timeouts + 1))
              elif grep -Eq 'FAIL!  :|Totals: .* [1-9][0-9]* failed' "$log"; then
                outcome=qt-assertion; assertions=$((assertions + 1))
              elif (( rc == 0 )) && grep -Eq 'Totals: .* 0 failed' "$log"; then
                outcome=pass; passes=$((passes + 1))
              else
                outcome=other-error; other_errors=$((other_errors + 1))
              fi
              echo "Mode=${mode} attempt=${attempt} outcome=${outcome} wrapper-exit=${rc}"
              rm -f "$log"
              echo "::endgroup::"
            done
          done
          echo "Comparison: pass=${passes} qt-assertion=${assertions} crash=${crashes} timeout=${timeouts} other-error=${other_errors}"
          (( assertions + crashes + timeouts + other_errors == 0 ))

          printf 'Diagnostic fake stream: %s\n' "$VELA_AUDIO_FAKE_STREAM"
          test -x "$VELA_AUDIO_FAKE_STREAM" || { echo "fake-stream executable missing" >&2; exit 1; }
          passes=0
          assertions=0
          crashes=0
          timeouts=0
          other_errors=0

          # All three modes get new independent private audio fixtures.
          # Repeat the isolated tests to expose order/timing differences.
          for mode in isolated isolated-gdb full-suite; do
            for attempt in 1 2 3; do
              echo "::group::audio investigation / ${mode} / attempt ${attempt}"
              log=$(mktemp)
              if [[ "${mode}" == isolated-gdb ]]; then
                args=(gdb --quiet --batch
                  -ex 'set pagination off'
                  -ex 'set print thread-events off'
                  -ex 'handle SIGSEGV stop print nopass'
                  -ex run
                  -ex 'thread apply all bt 30'
                  -ex 'info registers'
                  --args build-fedora/tests/audio/vela-audio-core-test chosenOutputIsRemembered)
              elif [[ "${mode}" == isolated ]]; then
                args=(build-fedora/tests/audio/vela-audio-core-test chosenOutputIsRemembered)
              else
                args=(build-fedora/tests/audio/vela-audio-core-test)
              fi
              # Do not let bash -e terminate the stress-test early.
              set +e
              timeout 150s python3 tests/audio/fixture.py -- "${args[@]}" 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
              set -e
              if grep -Eq 'Program received signal SIG(SEGV|ABRT|BUS|ILL)|Received signal 11|SIGSEGV|SIGABRT' "$log"; then
                outcome=crash; crashes=$((crashes + 1))
              elif (( rc == 124 || rc == 137 )); then
                outcome=timeout; timeouts=$((timeouts + 1))
              elif grep -Eq 'FAIL!  :|Totals: .* [1-9][0-9]* failed' "$log"; then
                outcome=qt-assertion; assertions=$((assertions + 1))
              elif (( rc == 0 )) && grep -Eq 'Totals: .* 0 failed' "$log"; then
                outcome=pass; passes=$((passes + 1))
              else
                outcome=other-error; other_errors=$((other_errors + 1))
              fi
              echo "Mode=${mode} attempt=${attempt} outcome=${outcome} wrapper-exit=${rc}"
              rm -f "$log"
              echo "::endgroup::"
            done
          done
          echo "Comparison: pass=${passes} qt-assertion=${assertions} crash=${crashes} timeout=${timeouts} other-error=${other_errors}"
          (( assertions + crashes + timeouts + other_errors == 0 ))
