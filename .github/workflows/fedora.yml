name: Fedora Build

# PR validation only; post-merge build and packaging run in build.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Fedora 45
    runs-on: ubuntu-latest
    container: fedora:45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-fedora
      CCACHE_MAXSIZE: 350M
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          git cmake ninja-build ccache gcc gcc-c++ pkgconf-pkg-config
          glslc vulkan-headers vulkan-loader-devel
          wayland-devel wayland-protocols-devel wlroots-devel
          libxkbcommon-devel pixman-devel libinput-devel libdrm-devel
          mesa-libgbm-devel freetype-devel harfbuzz-devel fontconfig-devel
          librsvg2-devel cairo-devel zlib-devel pam-devel polkit-devel
          qt6-qtbase-devel qt6-qtbase-private-devel
          qt6-qtdeclarative-devel qt6-qtsvg-devel
          qt6-qtwayland-devel qt6-qttools-devel layer-shell-qt-devel
          gtest-devel python3 dbus-daemon
          pipewire-devel wireplumber-devel pipewire pipewire-utils wireplumber

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Fedora compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-fedora
          key: ccache-fedora45-relwithdebinfo-v1-${{ github.sha }}
          restore-keys: |
            ccache-fedora45-relwithdebinfo-v1-

      - name: Configure
        run: >-
          cmake -S . -B build-fedora -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build-fedora --parallel 2
      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi


      - name: CPU-only tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The packaging-tests job in Build owns this suite for PRs.
          # Explicit manual runs remain self-contained.
          exclude='^(functional|sharpness)$'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            exclude='^(functional|sharpness|packaging-update)$'
          fi
          ctest --test-dir build-fedora --output-on-failure --parallel 2 -E "$exclude"
