# Temporary: checks whether Vast.ai VMs (through Cirun) could replace the
# self-hosted NVIDIA runner. Runs only on pushes to its own branch, which is
# never merged.
name: NVIDIA probe (Vast.ai)

on:
  push:
    branches: [ci/nvidia-vast-probe]

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [cirun-vast-4060ti-cli, cirun-vast-4060ti-desktop]
    runs-on: "${{ matrix.runner }}--${{ github.run_id }}"
    timeout-minutes: 30
    steps:
      # actions/checkout v7 fails with the git of the Vast.ai images (2.34).
      - name: Fetch the probe
        run: curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" | tar -xz --strip-components=1
      - name: Driver, render node, Vulkan and GBM
        run: bash .github/nvidia-probe/probe.sh
