# Temporary: checks whether Vast.ai machines (through Cirun) could replace
# the self-hosted NVIDIA runner. Runs only on pushes to its own branch, which
# is never merged. One machine at a time: the VM starts after the container.
name: NVIDIA probe (Vast.ai)

on:
  push:
    branches: [ci/nvidia-vast-probe]

permissions:
  contents: read

jobs:
  container:
    name: Probe Ubuntu 24.04 container
    runs-on: "cirun-vast-4060ti-container--${{ github.run_id }}"
    timeout-minutes: 30
    steps:
      - name: Fetch the probe
        run: curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" | tar -xz --strip-components=1
      - name: Driver, render node, Vulkan and GBM
        run: bash .github/nvidia-probe/probe.sh

  ubuntu-vm:
    name: Probe Ubuntu 24.04 VM
    needs: container
    if: ${{ !cancelled() }}
    runs-on: "cirun-vast-4060ti-vm--${{ github.run_id }}"
    timeout-minutes: 30
    steps:
      # actions/checkout v7 fails with the git of the Vast.ai images (2.34).
      - name: Fetch the probe
        run: curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" | tar -xz --strip-components=1
      - name: Driver, render node, Vulkan and GBM
        run: bash .github/nvidia-probe/probe.sh
