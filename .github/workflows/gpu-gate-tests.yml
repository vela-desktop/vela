name: GPU CI gate regression tests

on:
  pull_request:
    paths:
      - '.github/workflows/gpu-gate.yml'
      - '.github/workflows/gpu-gate-tests.yml'
      - 'tests/gpu-gate.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run GPU gate decision tests
        run: node --test tests/gpu-gate.test.mjs
