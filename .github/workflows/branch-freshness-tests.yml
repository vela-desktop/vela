# SPDX-License-Identifier: GPL-3.0-or-later
name: Branch freshness regression tests

on:
  pull_request:
    paths:
      - '.github/workflows/branch-freshness.yml'
      - 'tests/branch-freshness.test.mjs'
      - '.github/workflows/branch-freshness-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run freshness status lifecycle tests
        run: node --test tests/branch-freshness.test.mjs
