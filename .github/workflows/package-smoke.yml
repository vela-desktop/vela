name: Standalone Package Test
# PR validation only; post-merge build and packaging run in build.yml.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-build:
    runs-on: ubuntu-latest
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-package
      CCACHE_MAXSIZE: 350M
    steps:
      - name: Build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel git cmake ccache python shaderc vulkan-headers wayland-protocols
          qt6-tools wlroots0.20 wayland libxkbcommon pixman libinput
          libdrm mesa vulkan-icd-loader freetype2 harfbuzz fontconfig
          librsvg cairo qt6-base qt6-declarative qt6-svg qt6-wayland
          layer-shell-qt pam polkit hicolor-icon-theme xorg-xwayland
          pipewire wireplumber
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore Arch package compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-package
          key: ccache-arch-package-v1-${{ github.sha }}
          restore-keys: |
            ccache-arch-package-v1-

      - name: Build checked-out revision with makepkg
        shell: bash
        run: |
          git config --system --add safe.directory '*'
          git checkout -B ci-package-source HEAD
          useradd -m builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder:builder "$CCACHE_DIR"
          cp -r packaging/arch /home/builder/pkgbuild
          chown -R builder:builder /home/builder/pkgbuild
          sed -i '/^OPTIONS=/s/\([( ]\)debug\b/\1!debug/' /etc/makepkg.conf
          su -s /bin/bash builder -c "CCACHE_DIR=$CCACHE_DIR ccache --zero-stats"
          su -s /bin/bash builder -c \
            "cd /home/builder/pkgbuild && \
            CCACHE_DIR=$CCACHE_DIR CCACHE_MAXSIZE=$CCACHE_MAXSIZE \
            CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            VELA_GIT_URL=file://$GITHUB_WORKSPACE MAKEFLAGS=-j2 \
            makepkg --noconfirm"

      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vela-smoke-package
          path: /home/builder/pkgbuild/vela-git-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
  package-install:
    needs: package-build
    runs-on: ubuntu-latest
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update fresh Arch image
        run: pacman -Syu --noconfirm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vela-smoke-package
          path: package-download
      - name: Install package and dependencies
        shell: bash
        run: |
          shopt -s nullglob
          packages=(package-download/vela-git-*.pkg.tar.zst)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one package"
            exit 1
          fi
          pacman -U --noconfirm --needed "${packages[0]}"
      - name: Smoke-test installed package
        run: bash scripts/ci-check-package.sh
