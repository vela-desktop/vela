# Automatic build on every push, in an Arch Linux container (the wlroots
# and Qt versions Vela uses are Arch's).
#
# - build: the whole project, test tools included, and the tests (ctest):
#   the compositor's (FrameClock, geometry, color...), the Explorer's, the
#   .desktop and default app ones. The functional and sharpness tests
#   (tests/functional) are reported as skipped here: the renderer wants a GPU
#   with a DRM node, which GitHub runners don't have.
# - package: main pushes and manual runs (including test branches), built
#   with the PKGBUILD,
#   downloadable from the run's page (Artifacts) and installable with
#   sudo pacman -U.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push on the same branch stops the previous build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPENDENCIES: >-
    base-devel git cmake ccache shaderc vulkan-headers vulkan-icd-loader gtest python
    wayland wayland-protocols wlroots0.20 libxkbcommon pixman libinput libdrm
    mesa freetype2 harfbuzz fontconfig librsvg cairo zlib pam polkit
    qt6-base qt6-declarative qt6-svg qt6-wayland qt6-tools layer-shell-qt
    hicolor-icon-theme xorg-xwayland pipewire wireplumber

jobs:
  packaging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Updater and package source contracts (no network or credentials)
        run: python3 -m unittest discover -s packaging/arch/tests -v
      - name: Reporter evidence contracts (no GPU or running session)
        run: PYTHONPATH=report python3 -m unittest discover -s report/tests -v
      - name: Package script syntax
        run: |
          sh -n packaging/arch/vela-update
          sh -n session/vela-session.in scripts/test-sharpness.sh
          bash -n packaging/arch/PKGBUILD

  # Pin the official Arch x86_64 container manifest. All these jobs run
  # pacman -Syu, but cannot silently change their base image identity.
  # Refresh the digest intentionally when updating the builder environment.
  # Independent of packaging contracts; both jobs still gate packaging.
  build:
    runs-on: ubuntu-latest
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ccache cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure
        run: >-
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          ccache --zero-stats
          cmake --build build -j "$(nproc)"
          ccache --show-stats

      - name: Tests
        run: ctest --test-dir build --output-on-failure -E '^packaging-update$'

      - name: Scripts
        run: |
          for script in packaging/arch/vela-update session/vela-session-env scripts/*.sh; do
            sh -n "$script"
          done

  package:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [packaging-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-package
      CCACHE_MAXSIZE: 350M
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the package version counts commits

      - name: Restore Arch package compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-package
          key: ccache-arch-package-v1-${{ github.sha }}
          restore-keys: |
            ccache-arch-package-v1-

      # makepkg doesn't run as root: a dedicated user, which takes Vela from
      # this copy of the repository.
      - name: Package
        run: |
          useradd -m builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder:builder "$CCACHE_DIR"
          cp -r packaging/arch /home/builder/pkgbuild
          chown -R builder /home/builder/pkgbuild
          git config --system --add safe.directory '*'
          # No -debug package: it doubles the time and weighs ten times as
          # much.
          sed -i '/^OPTIONS=/s/\([( ]\)debug\b/\1!debug/' /etc/makepkg.conf
          cd /home/builder/pkgbuild
          su -s /bin/bash builder -c "CCACHE_DIR=$CCACHE_DIR ccache --zero-stats"
          su -s /bin/bash builder -c \
            "cd /home/builder/pkgbuild && \
            CCACHE_DIR=$CCACHE_DIR CCACHE_MAXSIZE=$CCACHE_MAXSIZE \
            CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            VELA_GIT_URL=file://$GITHUB_WORKSPACE MAKEFLAGS=-j$(nproc) \
            makepkg --noconfirm"


      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

      - name: Assert exactly one package for this commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(/home/builder/pkgbuild/vela-git-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          short_sha="${GITHUB_SHA:0:7}"
          [[ "${packages[0]}" == *".g${short_sha}-"* ]]

      # Signed SLSA provenance for the *actual* package bytes produced by
      # this workflow. A public Sigstore attestation is bound to the artifact
      # digest and the GitHub OIDC workflow/source identity.
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: /home/builder/pkgbuild/vela-git-*.pkg.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vela-git
          path: /home/builder/pkgbuild/vela-git-[0-9]*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  # Install and smoke-test the EXACT binary from the package job, not an
  # independently rebuilt package in another workflow. This gates release.
  package-smoke:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update fresh Arch image
        run: pacman -Syu --noconfirm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vela-git
          path: dist
      - name: Install attested package and check runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/vela-git-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          [[ "${packages[0]}" == *".g${GITHUB_SHA:0:7}-"* ]]
          pacman -U --noconfirm --needed "${packages[0]}"
          bash scripts/ci-check-package.sh

  # Build the SAME revision as the Arch package, in Fedora 44.
  fedora-package:
    needs: packaging-tests
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Install RPM packaging dependencies
        run: >-
          dnf install -y
          git rpm-build cmake ninja-build gcc gcc-c++ pkgconf-pkg-config
          glslc vulkan-headers vulkan-loader-devel
          wayland-devel wayland-protocols-devel wlroots-devel
          libxkbcommon-devel pixman-devel libinput-devel libdrm-devel
          mesa-libgbm-devel freetype-devel harfbuzz-devel fontconfig-devel
          librsvg2-devel cairo-devel zlib-devel pam-devel polkit-devel
          qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel
          qt6-qtsvg-devel qt6-qtwayland-devel qt6-qttools-devel
          layer-shell-qt-devel python3 pipewire-devel wireplumber-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create exact-commit source archive
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS}
          cp packaging/fedora/vela.spec rpmbuild/SPECS/vela.spec
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Invalid project VERSION: $version"; exit 1; }
          echo "VELA_RPM_VERSION=$version" >> "$GITHUB_ENV"
          git archive --format=tar.gz --prefix="vela-$version/" HEAD > "rpmbuild/SOURCES/vela-$version.tar.gz"
      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          rpmbuild -bb rpmbuild/SPECS/vela.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "vela_version $VELA_RPM_VERSION" \
            --define "vela_commit $GITHUB_SHA" \
            --define "vela_short $(git rev-parse --short=7 HEAD)" \
            --define "vela_count $(git rev-list --count HEAD)"
          shopt -s nullglob
          rpm_files=(rpmbuild/RPMS/x86_64/vela-git-[0-9]*.x86_64.rpm)
          test "${#rpm_files[@]}" -eq 1
          [[ "${rpm_files[0]}" == *".g${GITHUB_SHA:0:7}."* ]]
      - name: Attest Fedora RPM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: rpmbuild/RPMS/x86_64/vela-git-[0-9]*.x86_64.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vela-fedora-rpm
          path: rpmbuild/RPMS/x86_64/vela-git-[0-9]*.x86_64.rpm
          if-no-files-found: error
          retention-days: 14

  # Install exactly the signed binary, not a second independently built RPM.
  fedora-package-smoke:
    needs: fedora-package
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vela-fedora-rpm
          path: dist
      - name: Fresh Fedora install and file/linkage smoke test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(dist/vela-git-[0-9]*.x86_64.rpm)
          test "${#rpms[@]}" -eq 1
          [[ "${rpms[0]}" == *".g${GITHUB_SHA:0:7}."* ]]
          dnf install -y --setopt=install_weak_deps=False "${rpms[0]}"
          rpm -V vela-git
          # Validate local RPM install/upgrade/downgrade/reinstall with real DNF5.
          dnf install -y rpm-build
          bash packaging/fedora/tests/ci-dnf-transactions.sh
          for name in vela-compositor vela-session vela-shell vela-settings vela-files vela-lock vela-update vela-report; do
            command -v "$name"
          done
          test -f /usr/share/wayland-sessions/vela.desktop
          test -f /etc/pam.d/vela-lock
          test -f /etc/xdg/xdg-desktop-portal-wlr/Vela
          for helper in vela-polkit-agent vela-polkit-prompt vela-report-gui vela-session-env; do
            test -x "/usr/libexec/vela/$helper"
          done
          test -f /usr/libexec/vela/report/vela_report/cli.py
          vela-report --help >/dev/null
          for exe in /usr/bin/vela-compositor /usr/bin/vela-shell /usr/bin/vela-settings /usr/bin/vela-files; do
            if ldd "$exe" | grep -F 'not found'; then
              echo "::error::Missing shared libraries for $exe"; exit 1
            fi
          done
          sh -n /usr/bin/vela-update

  # Public per-commit alpha packages, available anonymously and retained
  # for the last five successful versions (older releases and tags are pruned).
  publish-alpha:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [package, package-smoke, fedora-package, fedora-package-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vela-git
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vela-fedora-rpm
          path: dist
      - name: Publish alpha package for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          packages=(vela-git-*.pkg.tar.zst)
          fedora_packages=(vela-git-[0-9]*.x86_64.rpm)
          test "${#packages[@]}" -eq 1
          test "${#fedora_packages[@]}" -eq 1
          # Fail closed: release only the same bytes signed by the official
          # build.yml workflow for this exact main commit.
          gh attestation verify "${packages[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          gh attestation verify "${fedora_packages[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          sha256sum "${packages[0]}" > SHA256SUMS
          sha256sum "${fedora_packages[0]}" > SHA256SUMS-fedora
          tag="alpha-${GITHUB_SHA}"
          if ! gh release create "$tag" "${packages[0]}" SHA256SUMS "${fedora_packages[0]}" SHA256SUMS-fedora \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Vela alpha ${GITHUB_SHA:0:12}" \
            --notes "Automated Arch Linux and Fedora 44 alpha packages for commit ${GITHUB_SHA}. Experimental software; not a stable release."; then
            # A workflow rerun may race with or follow a successful publish.
            # Accept an existing release only if both expected assets are present
            # and its checksum manifest matches this exact built package.
            echo ":: Checking whether the exact alpha package was already published"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq '.isPrerelease' | grep -qx true
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fxq "${packages[0]}"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fxq "${fedora_packages[0]}"
            mkdir -p previous
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'SHA256SUMS*' --dir previous
            cmp SHA256SUMS previous/SHA256SUMS
            cmp SHA256SUMS-fedora previous/SHA256SUMS-fedora
            echo ":: Existing release matches this build; continuing"
          fi
      - name: Retain latest five Vela alpha releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/prune-alpha-releases.sh
