# Automatic build on every push, in an Arch Linux container (the wlroots
# and Qt versions Vela uses are Arch's).
#
# - build: the whole project, test tools included, and the tests (ctest):
#   the compositor's (FrameClock, geometry, color...), the Explorer's, the
#   .desktop and default app ones. The functional and sharpness tests
#   (tests/functional) are reported as skipped here: the renderer wants a GPU
#   with a DRM node, which GitHub runners don't have.
# - package: main pushes and manual runs (including test branches), built
#   with the PKGBUILD,
#   downloadable from the run's page (Artifacts) and installable with
#   sudo pacman -U.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push on the same branch stops the previous build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPENDENCIES: >-
    base-devel git cmake ccache shaderc vulkan-headers vulkan-icd-loader gtest python
    wayland wayland-protocols wlroots0.20 libxkbcommon pixman libinput libdrm
    mesa freetype2 harfbuzz fontconfig librsvg cairo zlib pam polkit
    qt6-base qt6-declarative qt6-svg qt6-wayland qt6-tools layer-shell-qt
    hicolor-icon-theme xorg-xwayland

jobs:
  packaging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Updater and package source contracts (no network or credentials)
        run: python3 -m unittest discover -s packaging/arch/tests -v
      - name: Reporter evidence contracts (no GPU or running session)
        run: PYTHONPATH=report python3 -m unittest discover -s report/tests -v
      - name: Package script syntax
        run: |
          sh -n packaging/arch/vela-update
          sh -n session/vela-session.in scripts/test-sharpness.sh
          bash -n packaging/arch/PKGBUILD

  build:
    needs: packaging-tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@v7

      - name: ccache cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure
        run: >-
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          cmake --build build -j "$(nproc)"
          ccache --show-stats

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Scripts
        run: |
          for script in packaging/arch/vela-update session/vela-session-env scripts/*.sh; do
            sh -n "$script"
          done

  package:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the package version counts commits

      # makepkg doesn't run as root: a dedicated user, which takes Vela from
      # this copy of the repository.
      - name: Package
        run: |
          useradd -m builder
          cp -r packaging/arch /home/builder/pkgbuild
          chown -R builder /home/builder/pkgbuild
          git config --system --add safe.directory '*'
          # No -debug package: it doubles the time and weighs ten times as
          # much.
          sed -i '/^OPTIONS=/s/\([( ]\)debug\b/\1!debug/' /etc/makepkg.conf
          cd /home/builder/pkgbuild
          su builder -c "VELA_GIT_URL=file://$GITHUB_WORKSPACE MAKEFLAGS=-j$(nproc) makepkg --noconfirm"

      - uses: actions/upload-artifact@v7
        with:
          name: vela-git
          path: /home/builder/pkgbuild/vela-git-[0-9]*.pkg.tar.zst
          retention-days: 14

  # Public per-commit alpha packages, available anonymously and retained
  # for the last five successful versions (older releases and tags are pruned).
  publish-alpha:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: vela-git
          path: dist
      - name: Publish alpha package for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          packages=(vela-git-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          sha256sum "${packages[0]}" > SHA256SUMS
          tag="alpha-${GITHUB_SHA}"
          gh release create "$tag" "${packages[0]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Vela alpha ${GITHUB_SHA:0:12}" \
            --notes "Automated Arch Linux alpha package for commit ${GITHUB_SHA}. Experimental software; not a stable release."
      - name: Retain latest five Vela alpha releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/prune-alpha-releases.sh
