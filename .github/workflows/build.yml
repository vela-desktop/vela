# Automatic build on every push, in an Arch Linux container (the wlroots
# and Qt versions Vela uses are Arch's).
#
# - build: the whole project, test tools included, and the tests (ctest):
#   the compositor's (FrameClock, geometry, color...), the Explorer's, the
#   .desktop and default app ones. The functional and sharpness tests
#   (tests/functional) are reported as skipped here: the renderer wants a GPU
#   with a DRM node, which GitHub runners don't have.
# - package: PRs, main pushes and manual runs (including test branches),
#   built with the PKGBUILD,
#   downloadable from the run's page (Artifacts) and installable with
#   sudo pacman -U.

name: Build

on:
  push:
    branches: [main]
    tags: ['v0.*']
  pull_request:
  workflow_dispatch:

# A new push on the same branch stops the previous build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPENDENCIES: >-
    base-devel git cmake ccache shaderc vulkan-headers vulkan-icd-loader gtest python
    wayland wayland-protocols wlroots0.20 libxkbcommon pixman libinput libdrm
    mesa freetype2 harfbuzz fontconfig librsvg cairo zlib pam polkit
    qt6-base qt6-declarative qt6-svg qt6-wayland qt6-tools qt6-multimedia layer-shell-qt
    hicolor-icon-theme shared-mime-info xorg-xwayland pipewire wireplumber systemd-libs

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Skip costly jobs for documentation-only PRs
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
          elif ! git rev-parse 'HEAD^2' >/dev/null 2>&1; then
            # Fail open for unexpected checkout topology: run all checks.
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
          else
            # Capture all changed paths; avoid grep -q / SIGPIPE with pipefail.
            non_docs=$(git diff --name-only 'HEAD^1' 'HEAD^2' |
                grep -Ev '^(docs/|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|.*\.md$)' || true)
            if [ -n "$non_docs" ]; then
              echo 'heavy=true' >> "$GITHUB_OUTPUT"
            else
              echo 'heavy=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  packaging-tests:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate standalone Sigstore verifier syntax
        run: python3 -m py_compile packaging/verify-attestation.py packaging/vela-update-state
      - name: Updater and package source contracts (no network or credentials)
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Reporter evidence contracts (no GPU or running session)
        run: PYTHONPATH=report python3 -m unittest discover -s report/tests -v
      - name: Recording timeline and promo contracts (no GPU needed)
        run: python3 -m unittest discover -s scripts/tests -p 'test_record*.py' -v
      - name: Package script syntax
        run: |
          sh -n packaging/vela-update packaging/vela-update-beta
          sh -n session/vela-session.in scripts/test-sharpness.sh
          bash -n packaging/arch/PKGBUILD packaging/arch/PKGBUILD.beta

  # Pin the official Arch x86_64 container manifest. All these jobs run
  # pacman -Syu, but cannot silently change their base image identity.
  # Refresh the digest intentionally when updating the builder environment.
  # Independent of packaging contracts; both jobs still gate packaging.
  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ccache cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure
        run: >-
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVELA_BUILD_TOOLS=ON

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          ccache --zero-stats
          cmake --build build -j "$(nproc)"
          ccache --show-stats

      - name: Tests
        run: ctest --test-dir build --output-on-failure -E '^packaging-update$'

      - name: Scripts
        run: |
          for script in packaging/vela-update packaging/vela-update-beta session/vela-session-env scripts/*.sh; do
            sh -n "$script"
          done

  package:
    needs: [packaging-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-package
      CCACHE_MAXSIZE: 350M
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed $DEPENDENCIES
          # makepkg runs unprivileged without --syncdeps: install only the
          # additional *runtime* desktop packages needed by the PKGBUILD.
          pacman -S --noconfirm --needed \
            konsole breeze-icons xdg-desktop-portal xdg-desktop-portal-gtk \
            xdg-desktop-portal-wlr xdg-utils xdg-terminal-exec

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the package version counts commits

      - name: Restore Arch package compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-package
          key: ccache-arch-package-v1-${{ github.sha }}
          restore-keys: |
            ccache-arch-package-v1-

      # makepkg doesn't run as root: a dedicated user, which takes Vela from
      # this copy of the repository.
      - name: Package
        run: |
          useradd -m builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder:builder "$CCACHE_DIR"
          cp -r packaging/arch /home/builder/pkgbuild
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            version="${GITHUB_REF_NAME#v}"
            sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9.]*\).*/\1/p' CMakeLists.txt | grep -Fx "$version" || {
              echo "::error::Release tag and project version differ"; exit 1;
            }
            cp packaging/arch/PKGBUILD.beta /home/builder/pkgbuild/PKGBUILD
          fi
          chown -R builder /home/builder/pkgbuild
          git config --system --add safe.directory '*'
          # No -debug package: it doubles the time and weighs ten times as
          # much.
          sed -i '/^OPTIONS=/s/\([( ]\)debug\b/\1!debug/' /etc/makepkg.conf
          cd /home/builder/pkgbuild
          su -s /bin/bash builder -c "CCACHE_DIR=$CCACHE_DIR ccache --zero-stats"
          su -s /bin/bash builder -c \
            "cd /home/builder/pkgbuild && \
            CCACHE_DIR=$CCACHE_DIR CCACHE_MAXSIZE=$CCACHE_MAXSIZE \
            CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            VELA_GIT_URL=file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA VELA_RELEASE_VERSION=${GITHUB_REF_NAME#v} MAKEFLAGS=-j$(nproc) \
            makepkg --noconfirm"


      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

      - name: Assert exactly one package for this commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(/home/builder/pkgbuild/vela-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            [[ "${packages[0]##*/}" == "vela-${GITHUB_REF_NAME#v}-"* ]]
          else
            [[ "${packages[0]}" == *".g${GITHUB_SHA:0:7}-"* ]]
          fi

      # Signed SLSA provenance for the *actual* package bytes produced by
      # this workflow. A public Sigstore attestation is bound to the artifact
      # digest and the GitHub OIDC workflow/source identity.
      - name: Attest package build provenance
        # PR builds validate packaging, but only main/manual outputs are signed.
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: /home/builder/pkgbuild/vela-*.pkg.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vela-git
          path: /home/builder/pkgbuild/vela-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  # Install and smoke-test the EXACT binary from the package job, not an
  # independently rebuilt package in another workflow. This gates release.
  package-smoke:
    needs: package
    runs-on: ubuntu-latest
    container: archlinux@sha256:522dd24e4a16f41afe71c7561febe519f7575404c291565e9f0be823d1794ca4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update fresh Arch image
        run: pacman -Syu --noconfirm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vela-git
          path: dist
      - name: Install built Arch package and check runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/vela-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            [[ "${packages[0]##*/}" == "vela-${GITHUB_REF_NAME#v}-"* ]]
            # A clean container needs all required Beta updater dependencies.
            pacman -S --noconfirm --needed cosign
          else
            [[ "${packages[0]}" == *".g${GITHUB_SHA:0:7}-"* ]]
          fi
          pacman -U --noconfirm --needed "${packages[0]}"
          package=vela-git
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then package=vela; fi
          VELA_PACKAGE_NAME="$package" bash scripts/ci-check-package.sh
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            # Exercise both directions of the actual pacman conflict transaction
            # with a disposable minimal vela-git fixture, then restore the
            # exact Beta binary being tested (never remove first).
            pacman -S --noconfirm --needed base-devel
            useradd -m vela-tester
            work=$(mktemp -d)
            chmod 755 "$work"
            chown vela-tester:vela-tester "$work"
            cat > "$work/PKGBUILD" <<'PKGBUILD'
          pkgname=vela-git
          pkgver=0.0.1
          pkgrel=1
          pkgdesc="Temporary channel replacement fixture"
          arch=('any')
          license=('GPL-3.0-or-later')
          provides=('vela')
          conflicts=('vela')
          package() {
            install -Dm644 /dev/null "$pkgdir/usr/share/vela-channel-smoke/marker"
          }
          PKGBUILD
            chown vela-tester:vela-tester "$work/PKGBUILD"
            su -s /bin/bash vela-tester -c "cd '$work' && makepkg --noconfirm"
            pacman --noconfirm --ask=4 -U "$work/vela-git-0.0.1-1-any.pkg.tar.zst"
            pacman -Q vela-git
            if pacman -Q vela >/dev/null 2>&1; then
              echo "::error::Beta still installed after replacement"; exit 1
            fi
            pacman --noconfirm --ask=4 -U "${packages[0]}"
            pacman -Q vela
            if pacman -Q vela-git >/dev/null 2>&1; then
              echo "::error::Experimental still installed after replacement"; exit 1
            fi
            rm -rf -- "$work"
          fi

  # Fedora CTest suite is a reusable workflow: its result gates releases.
  fedora-tests:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/fedora.yml
    permissions:
      contents: read

  # Build the SAME revision as the Arch package, in Fedora 44.
  fedora-package:
    needs: packaging-tests
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-fedora-rpm
      CCACHE_MAXSIZE: 500M
    runs-on: ubuntu-latest
    container: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # official Fedora 44 image index
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Install RPM packaging dependencies
        run: >-
          dnf install -y
          git rpm-build dnf5-plugins ccache cmake ninja-build gcc gcc-c++ pkgconf-pkg-config
          glslc vulkan-headers vulkan-loader-devel
          wayland-devel wayland-protocols-devel wlroots-devel
          libxkbcommon-devel pixman-devel libinput-devel libdrm-devel
          mesa-libgbm-devel freetype-devel harfbuzz-devel fontconfig-devel
          librsvg2-devel cairo-devel zlib-devel pam-devel polkit-devel
          qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel
          qt6-qtsvg-devel qt6-qtwayland-devel qt6-qttools-devel
          layer-shell-qt-devel python3 pipewire-devel wireplumber-devel systemd-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore Fedora RPM compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-fedora-rpm
          key: ccache-fedora44-rpm-v1-${{ github.sha }}
          restore-keys: ccache-fedora44-rpm-v1-
      - name: Create exact-commit source archive
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS}
          cp packaging/fedora/vela.spec rpmbuild/SPECS/vela.spec
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Invalid project VERSION: $version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            test "$version" = "${GITHUB_REF_NAME#v}" || {
              echo "::error::RPM source version differs from release tag"; exit 1;
            }
          fi
          echo "VELA_RPM_VERSION=$version" >> "$GITHUB_ENV"
          git archive --format=tar.gz --prefix="vela-$version/" HEAD > "rpmbuild/SOURCES/vela-$version.tar.gz"
      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          # Exercise the actual spec with DNF5, not just an updater stub.
          dnf builddep -y --define "vela_version $VELA_RPM_VERSION" rpmbuild/SPECS/vela.spec
          channel=experimental
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then channel=beta; fi
          rpmbuild -bb rpmbuild/SPECS/vela.spec \
            --define "vela_channel $channel" \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "vela_version $VELA_RPM_VERSION" \
            --define "vela_commit $GITHUB_SHA" \
            --define "vela_short $(git rev-parse --short=7 HEAD)" \
            --define "vela_count $(git rev-list --count HEAD)" \
            --define "vela_ccache 1"
          shopt -s nullglob
          # Select the main package only; RPM also builds debuginfo/debugsource.
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            rpm_files=(rpmbuild/RPMS/x86_64/vela-[0-9]*.x86_64.rpm)
            test "${#rpm_files[@]}" -eq 1
            [[ "${rpm_files[0]##*/}" == "vela-${GITHUB_REF_NAME#v}-"* ]]
          else
            rpm_files=(rpmbuild/RPMS/x86_64/vela-git-[0-9]*.x86_64.rpm)
            test "${#rpm_files[@]}" -eq 1
            [[ "${rpm_files[0]}" == *".g${GITHUB_SHA:0:7}."* ]]
          fi
      - name: Fedora RPM ccache statistics
        if: always()
        run: ccache --show-stats || true
      - name: Attest Fedora RPM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            rpmbuild/RPMS/x86_64/vela-git-[0-9]*.x86_64.rpm
            rpmbuild/RPMS/x86_64/vela-[0-9]*.x86_64.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vela-fedora-rpm
          path: |
            rpmbuild/RPMS/x86_64/vela-git-[0-9]*.x86_64.rpm
            rpmbuild/RPMS/x86_64/vela-[0-9]*.x86_64.rpm
          if-no-files-found: error
          retention-days: 14

  # Install exactly the signed binary, not a second independently built RPM.
  fedora-package-smoke:
    needs: fedora-package
    runs-on: ubuntu-latest
    container: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # official Fedora 44 image index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vela-fedora-rpm
          path: dist
      - name: Fresh Fedora install and file/linkage smoke test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(dist/vela-*.x86_64.rpm)
          test "${#rpms[@]}" -eq 1
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            [[ "${rpms[0]##*/}" == "vela-${GITHUB_REF_NAME#v}-"* ]]
          else
            [[ "${rpms[0]}" == *".g${GITHUB_SHA:0:7}."* ]]
          fi
          # Exercise the full local Git -> builddep -> rpmbuild -> DNF updater path
          # against a tiny fixture before installing the actual Vela RPM.
          dnf install -y git rpm-build dnf5-plugins
          bash packaging/fedora/tests/ci-updater-local-build.sh
          # The updater fixture performs several local RPM transactions.
          # Refresh Fedora metadata before the real runtime dependency install:
          # cached mirrors can reference packages already superseded (404).
          dnf clean metadata
          # Use normal DNF defaults so recommended desktop/updater tools
          # are exercised along with the mandatory runtime dependencies.
          dnf --refresh install -y "${rpms[0]}"
          # DNF installs the recommended portal integrations by default;
          # unlike Arch, Fedora deliberately keeps them optional in the RPM.
          rpm -q xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-wlr
          test -f /usr/share/xdg-desktop-portal/vela-portals.conf
          grep -Fxq 'default=gtk;kde' /usr/share/xdg-desktop-portal/vela-portals.conf
          grep -Fxq 'org.freedesktop.impl.portal.ScreenCast=wlr' /usr/share/xdg-desktop-portal/vela-portals.conf
          grep -Fxq 'org.freedesktop.impl.portal.Screenshot=wlr' /usr/share/xdg-desktop-portal/vela-portals.conf
          package_name=vela-git
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then package_name=vela; fi
          rpm -V "$package_name"
          if [[ "$package_name" == vela ]]; then other_package=vela-git; else other_package=vela; fi
          rpm -q --conflicts "$package_name" | grep -Fx "$other_package"
          installed_requires=$(rpm -q --requires "$package_name")
          for dependency in git util-linux rpm dnf5; do
            grep -Fx "$dependency" <<< "$installed_requires"
          done
          for tool in git flock curl dnf rpmbuild python3; do
            command -v "$tool"
          done
          # Validate local RPM install/upgrade/downgrade/reinstall with real DNF5.
          dnf install -y rpm-build
          if [[ "$GITHUB_REF" != refs/tags/v0.* ]]; then
            bash packaging/fedora/tests/ci-dnf-transactions.sh
          fi
          for name in vela-compositor vela-session vela-shell vela-settings vela-files vela-lock vela-update vela-report; do
            command -v "$name"
          done
          test -f /usr/share/wayland-sessions/vela.desktop
          test -f /etc/pam.d/vela-lock
          test -f /etc/xdg/xdg-desktop-portal-wlr/Vela
          test -f /usr/lib/udev/rules.d/70-vela-i2c.rules
          test -f /usr/lib/modules-load.d/vela-i2c.conf
          for helper in vela-bluetooth vela-brightness vela-polkit-agent vela-polkit-prompt vela-report-gui vela-session-env vela-update-daemon; do
            test -x "/usr/libexec/vela/$helper"
          done
          # Without sd-bus the helper builds, but can't change a laptop's backlight.
          ldd /usr/libexec/vela/vela-brightness | grep -F libsystemd.so
          ldd /usr/libexec/vela/vela-bluetooth | grep -F libsystemd.so
          ldd /usr/libexec/vela/vela-update-daemon | grep -F libsystemd.so
          # The terminal Settings > Updates runs vela-update in.
          command -v xdg-terminal-exec
          test -f /usr/libexec/vela/report/vela_report/cli.py
          # The archive's source metadata must not inherit CI's parent git state.
          grep -F "\"source_commit\": \"$GITHUB_SHA\"" /usr/bin/vela-report
          grep -F '"dirty": "false" == "true"' /usr/bin/vela-report
          vela-report --help >/dev/null
          for exe in /usr/bin/vela-compositor /usr/bin/vela-shell /usr/bin/vela-settings /usr/bin/vela-files; do
            if ldd "$exe" | grep -F 'not found'; then
              echo "::error::Missing shared libraries for $exe"; exit 1
            fi
          done
          test -f /usr/libexec/vela/verify-attestation.py
          test -x /usr/libexec/vela/vela-update-state
          sh -n /usr/bin/vela-update

  # The exact Ubuntu Beta DEB must pass its clean-install smoke test.
  ubuntu-beta:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    uses: ./.github/workflows/ubuntu.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

  # Only version tags publish official Beta binaries. Ordinary pushes to
  # main keep ephemeral Experimental build artifacts without GitHub Releases.
  publish-beta:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    needs: [package, package-smoke, fedora-tests, fedora-package, fedora-package-smoke, ubuntu-beta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vela-git
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vela-fedora-rpm
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vela-ubuntu-26.10-deb
          path: dist
      - name: Publish signed Beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Only numbered v0.x.y Beta tags can publish"; exit 1;
          }
          cd dist
          shopt -s nullglob
          packages=(vela-[0-9]*.pkg.tar.zst)
          fedora_packages=(vela-[0-9]*.x86_64.rpm)
          ubuntu_packages=(vela_[0-9]*_amd64.deb)
          test "${#packages[@]}" -eq 1
          test "${#fedora_packages[@]}" -eq 1
          test "${#ubuntu_packages[@]}" -eq 1
          for p in "${packages[0]}" "${fedora_packages[0]}"; do
            gh attestation verify "$p" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
          gh attestation verify "${ubuntu_packages[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ubuntu.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
          sha256sum "${ubuntu_packages[0]}" > SHA256SUMS-ubuntu
          sha256sum "${packages[0]}" > SHA256SUMS
          sha256sum "${fedora_packages[0]}" > SHA256SUMS-fedora
          # Reruns must never overwrite already-published release bytes.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq '.isPrerelease' | grep -Fxq true
            for asset in "${packages[0]}" "${fedora_packages[0]}" "${ubuntu_packages[0]}" \
                         SHA256SUMS SHA256SUMS-fedora SHA256SUMS-ubuntu; do
              gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name' | grep -Fxq "$asset"
            done
            mkdir -p previous
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern 'SHA256SUMS*' --dir previous
            for manifest in SHA256SUMS SHA256SUMS-fedora SHA256SUMS-ubuntu; do
              cmp "$manifest" "previous/$manifest"
            done
            echo ":: Existing release matches verified packages; keeping it unchanged"
          else
            gh release create "$GITHUB_REF_NAME" "${packages[0]}" SHA256SUMS \
              "${fedora_packages[0]}" SHA256SUMS-fedora \
              "${ubuntu_packages[0]}" SHA256SUMS-ubuntu \
              --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "Vela ${GITHUB_REF_NAME#v} Beta" --generate-notes
          fi
