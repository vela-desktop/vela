<!-- What cppcheck cannot learn from Vela's sources alone: CI runs it without
     system include paths, so the macros of system headers that change control
     flow are spelled out here (docs/ci-lanes.md). -->
<def format="2">
  <define name="WL_TYPEOF(expr)" value="__typeof__(expr)"/>
  <define name="wl_container_of(ptr, sample, member)" value="(__typeof__(sample))((char *)(ptr) - offsetof(__typeof__(*sample), member))"/>
  <define name="wl_list_for_each(pos, head, member)" value="for (pos = wl_container_of((head)->next, pos, member); &amp;pos->member != (head); pos = wl_container_of(pos->member.next, pos, member))"/>
  <define name="wl_list_for_each_safe(pos, tmp, head, member)" value="for (pos = wl_container_of((head)->next, pos, member), tmp = wl_container_of((pos)->member.next, tmp, member); &amp;pos->member != (head); pos = tmp, tmp = wl_container_of(pos->member.next, tmp, member))"/>
  <define name="wl_list_for_each_reverse(pos, head, member)" value="for (pos = wl_container_of((head)->prev, pos, member); &amp;pos->member != (head); pos = wl_container_of(pos->member.prev, pos, member))"/>
  <define name="wl_list_for_each_reverse_safe(pos, tmp, head, member)" value="for (pos = wl_container_of((head)->prev, pos, member), tmp = wl_container_of((pos)->member.prev, tmp, member); &amp;pos->member != (head); pos = tmp, tmp = wl_container_of(pos->member.prev, tmp, member))"/>
  <define name="wl_array_for_each(pos, array)" value="for (pos = (array)->data; (array)->size != 0 &amp;&amp; (const char *) pos &lt; ((const char *) (array)->data + (array)->size); (pos)++)"/>
  <define name="VKAPI_ATTR" value=""/>
  <define name="VKAPI_CALL" value=""/>
  <define name="VKAPI_PTR" value=""/>
  <define name="__has_feature(x)" value="0"/>
  <define name="PW_DEFAULT_REMOTE" value="&quot;pipewire-0&quot;"/>
  <!-- Qt Test's checks return from the test function when they fail. -->
  <define name="QVERIFY(statement)" value="do { if (!(statement)) return; } while (false)"/>
  <define name="QVERIFY2(statement, description)" value="do { if (!(statement)) return; } while (false)"/>
  <define name="QCOMPARE(actual, expected)" value="do { if (!((actual) == (expected))) return; } while (false)"/>
  <define name="QTRY_VERIFY(expr)" value="do { if (!(expr)) return; } while (false)"/>
  <define name="QTRY_VERIFY_WITH_TIMEOUT(expr, timeout)" value="do { if (!(expr)) return; } while (false)"/>
  <define name="QTRY_COMPARE(expr, expected)" value="do { if (!((expr) == (expected))) return; } while (false)"/>
  <define name="QTRY_COMPARE_WITH_TIMEOUT(expr, expected, timeout)" value="do { if (!((expr) == (expected))) return; } while (false)"/>
  <define name="QFAIL(message)" value="return"/>
  <define name="QSKIP(statement)" value="return"/>
</def>
