# GTK is the preferred generic portal backend; KDE is an optional fallback for
# users who intentionally run without GTK. The default Arch package installs
# GTK and does not require KDE portals or Plasma. Screen capture always uses
# wlr with Vela's source chooser.
[preferred]
default=gtk;kde
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
