# Generic application portals use the GTK backend when installed. Screen
# capture and sharing remain on xdg-desktop-portal-wlr, with Vela's source
# chooser. No KDE desktop portal is required.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
