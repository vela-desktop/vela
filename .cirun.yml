# Temporary: on-demand Vast.ai machines with an RTX 4060 Ti, to find out
# whether they can replace the self-hosted NVIDIA runner. An Arch container
# (does Vast give it /dev/dri?) and an Ubuntu 24.04 VM (Vast's VMs only boot
# its own Ubuntu images). No RAM or disk minimum: Cirun found no 4060 Ti VM
# with them, while Vast listed several.
runners:
  - name: vast-4060ti-arch
    cloud: vast_ai
    instance_type: 1xRTX_4060_Ti
    machine_image: archlinux:latest
    labels:
      - cirun-vast-4060ti-arch
  - name: vast-4060ti-vm
    cloud: vast_ai
    instance_type: 1xRTX_4060_Ti
    machine_image: vastai/kvm:ubuntu_desktop_24.04-2025-11-24
    labels:
      - cirun-vast-4060ti-vm
    extra_config:
      vm: true
