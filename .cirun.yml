# Temporary: an on-demand Vast.ai container with an RTX 4060 Ti, to find out
# whether it can replace the self-hosted NVIDIA runner. Vast gives its
# containers /dev/dri and the NVIDIA graphics driver; this one tries Arch
# again, by another name: Cirun never created archlinux:latest.
runners:
  - name: vast-4060ti-arch
    cloud: vast_ai
    instance_type: 1xRTX_4060_Ti
    machine_image: archlinux/archlinux:latest
    labels:
      - cirun-vast-4060ti-arch
    extra_config:
      disk_space: 40
