# Temporary: on-demand Vast.ai VMs with an Ada GPU, to find out whether
# they can replace the self-hosted NVIDIA runner. Two VM images, since we
# don't yet know which one ships a driver with Vulkan and GBM. Few hosts
# rent their GPUs as VMs, so Cirun tries the cheapest first, then the next.
runners:
  - name: vast-ada-cli
    cloud: vast_ai
    instance_type:
      - 1xRTX_4060_Ti
      - 1xRTX_4070
      - 1xRTX_4070_Ti
      - 1xRTX_4080
      - 1xRTX_4090
    machine_image: vastai/kvm:ubuntu_cli_22.04-2025-11-21
    labels:
      - cirun-vast-ada-cli
    extra_config:
      disk_space: 60
      min_ram: 16
      vm: true
  - name: vast-ada-desktop
    cloud: vast_ai
    instance_type:
      - 1xRTX_4060_Ti
      - 1xRTX_4070
      - 1xRTX_4070_Ti
      - 1xRTX_4080
      - 1xRTX_4090
    machine_image: vastai/kvm:ubuntu_desktop_24.04-2025-11-24
    labels:
      - cirun-vast-ada-desktop
    extra_config:
      disk_space: 60
      min_ram: 16
      vm: true
