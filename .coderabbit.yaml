# CodeRabbit reviews code, build files and tests. Files without logic stay
# out of the review and out of its per-PR file limit.
reviews:
  path_filters:
    # Documentation, design documents and the changelog.
    - "!**/*.md"
    # Qt Linguist translations.
    - "!**/i18n/*.ts"
    # Per-directory formatting settings.
    - "!**/.clang-format"
    # XKB rules fixtures for the Settings tests.
    - "!settings/tests/keyboard/**"
