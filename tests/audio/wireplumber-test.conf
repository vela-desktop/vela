# WirePlumber for the audio tests (docs/audio.md §11), loaded as
# "wireplumber -p vela-test": the normal policy, defaults, routes and state,
# without hardware monitors and without D-Bus. The fixture copies this file
# into its private XDG_CONFIG_HOME.

wireplumber.profiles = {
  vela-test = {
    inherits = [ main ]

    # The devices are the null sinks of pipewire.conf.
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled

    # No session or system bus in the tests.
    support.dbus = disabled
    support.system-dbus = disabled
    support.reserve-device = disabled
    support.portal-permissionstore = disabled
    script.client.access-portal = disabled
    support.logind = disabled
    support.modem-manager = disabled
    support.mpris = disabled
  }
}
