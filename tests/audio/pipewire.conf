# PipeWire for the audio tests (docs/audio.md §11): no hardware, no realtime,
# no D-Bus. Fake devices made of null sinks, at fixed names the tests use.

context.properties = {
    core.daemon = true
    core.name = pipewire-0
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    # Small and fixed: level meters and the test sound answer quickly.
    default.clock.quantum = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024
    link.max-buffers = 16
    mem.allow-mlock = false
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]

context.objects = [
    # Drives the graph when nothing else does.
    { factory = spa-node-factory
        args = {
            factory.name = support.node.driver
            node.name = Dummy-Driver
            node.group = pipewire.dummy
            node.sync-group = sync.dummy
            priority.driver = 200000
        }
    }
    { factory = spa-node-factory
        args = {
            factory.name = support.node.driver
            node.name = Freewheel-Driver
            node.group = pipewire.freewheel
            node.sync-group = sync.dummy
            node.freewheel = true
            priority.driver = 190000
        }
    }
    # The outputs. "Speakers" has the highest priority: WirePlumber picks it
    # as the default output.
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = vela-test-speakers
            node.description = "Test Speakers"
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            priority.session = 2000
            monitor.channel-volumes = true
            object.linger = true
        }
    }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = vela-test-headphones
            node.description = "Test Headphones"
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            priority.session = 1000
            monitor.channel-volumes = true
            object.linger = true
        }
    }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = vela-test-surround
            node.description = "Test Surround 5.1"
            media.class = Audio/Sink
            audio.position = [ FL FR FC LFE RL RR ]
            priority.session = 500
            monitor.channel-volumes = true
            object.linger = true
        }
    }
    # The microphone.
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = vela-test-microphone
            node.description = "Test Microphone"
            media.class = Audio/Source/Virtual
            audio.position = [ MONO ]
            priority.session = 2000
            object.linger = true
        }
    }
]
