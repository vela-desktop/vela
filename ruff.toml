required-version = "==0.17.5"
target-version = "py313"

# Include Python entry points that do not use the .py extension.
extend-include = ["packaging/vela-update-state", "report/vela-report.in"]

# Generated build trees and downloaded packaging sources are not project code.
extend-exclude = ["build-*", "packaging/arch/src", "packaging/arch/pkg", "packaging/arch/vela"]

[lint]
select = ["E4", "E7", "E9", "F", "UP"]
