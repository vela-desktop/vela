# Expressive: Vela Expressive's quick settings and notification center on their own, tiles that change shape and grouped notifications, inspired by Material 3 Expressive
# The panels in M3's extra large corners (28); what they hold follows them
# (M3's nested corners, the panel's radius less the gap): the tiles 16, the
# cards 20, as Vela Expressive.
# Original author: Brando Giuffrida
schema-version=1
quicksettings-variant=expressive
quicksettings-radius=28
quicksettings-tile-radius=16
notifications-variant=expressive
notifications-radius=28
notifications-card-radius=16
