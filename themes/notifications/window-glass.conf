# Window Glass: Windhawk's Windows 11 Notification Center Styler theme
# "WindowGlass" (Themes/WindowGlass/README.md), with Lowell137's reference
# screenshots (2026-10-20).
# Action Center (quick settings): CornerRadius=20, toggles rounder (CR2=14
# in the README; the reference shows bigger tiles).
# Original author: Lowell137
quicksettings-radius=20
quicksettings-tile-radius=16
# Notification Center: CornerRadius=20, list items CR3=12.
notifications-radius=20
notifications-card-radius=12
# The reference's quick settings: a thick volume slider (and what plays now
# on its own card below the panel, once Vela's quick settings have one).
quicksettings-thick-slider=1
# Lowell137's WindowGlass recording (2026-10-30): the tile's arrow beside its icon,
# no footer band.
quicksettings-inline-arrow=1
quicksettings-flat-footer=1
quicksettings-borderless=1
# The calendar card (today's date with a fold button, weekdays, today a circle,
# the focus timer) is every style's default now: nothing to set.
