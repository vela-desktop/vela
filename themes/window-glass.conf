# Window Glass: Windhawk's WindowGlass theme, its default "Glass" background:
# <WindhawkBlur BlurAmount="5" TintColor=SystemChromeMedium TintOpacity="0.7"/>.
# A plain tint over a light blur, no saturation or luminosity of the acrylic's;
# lowell's recording of 2026-10-30 measures the same (about 0.67 of #1E1C1C).
# The complete look: the taskbar, Start and quick settings of lowell's Window
# Glass styles (taskbar/, startmenu/, notifications/window-glass.conf) too.
# Original author: lowell
schema-version=1
dark.surface=#B31F1F1F
light.surface=#B3E6E6E6
dark.taskbar=#B31F1F1F
light.taskbar=#B3E6E6E6
dark.popup=#B31F1F1F
light.popup=#B3E6E6E6
dark.backdrop=#66101010
light.backdrop=#8CECECEC
dark.stroke=#40808080
light.stroke=#40808080
radiusCard=12
radiusOverlay=12

# Glass windows, following lowell's reference screenshots of WindowGlass on
# Windows (2026-10-20): the window background see-through.
dark.background=#991C1C1E
light.background=#B3F3F3F3

# BlurAmount=5 of the acrylic's 30: Vela's lightest blur, no extra
# saturation, no gray wash (the fills above are the tint).
blur-strength=0.25
blur-saturation=1.0
blur-tint=0

# The taskbar (taskbar/window-glass.conf): Windhawk's Taskbar Styler
# "WindowGlass", Glass variant, scaled to Vela's size: apps and tray in one
# floating pill shrunk to its content, radius 24, no stroke.
taskbar-height=52
taskbar-margin=2
taskbar-radius=24
taskbar-fit=1
taskbar-button-width=40
taskbar-button-height=36
taskbar-button-radius=8
taskbar-icon-size=24
taskbar-stroke=#00000000

# Start (startmenu/window-glass.conf): Width=650, CornerRadius=35.
startmenu-width=650
startmenu-radius=35

# Quick settings and the notification center (notifications/window-glass.conf):
# CornerRadius=20, rounder tiles, a thick volume slider, the tile's arrow
# beside its icon, no footer band, borderless tiles.
quicksettings-radius=20
quicksettings-tile-radius=16
notifications-radius=20
notifications-card-radius=12
quicksettings-thick-slider=1
quicksettings-inline-arrow=1
quicksettings-flat-footer=1
quicksettings-borderless=1
