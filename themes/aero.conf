# Aero: Windows Vista and 7's glass: bright sky-blue, translucent, over a
# vivid blur, a white hairline on the edges, small radii. The complete look:
# lowell's taskbar style "aero" (the orb, glossy buttons), Start menu style
# "down-aero" and quick settings style "aero" too.
# Original author: lowell
accent=#4A9BE0
dark.background=#A06C95C4
light.background=#B3C4DCF2
dark.surface=#B38AB4E4
light.surface=#B3BAD8F5
dark.popup=#E67FAEDF
light.popup=#E6D4E6F8
dark.backdrop=#8C2F5F94
light.backdrop=#99B0CFEE
dark.stroke=#B3FFFFFF
light.stroke=#B3FFFFFF
radius=3
radiusCard=5
radiusOverlay=7
blur-strength=2.0
blur-saturation=1.7
# Clear glass: the blur keeps the colors behind it, no gray wash.
blur-tint=0
# Aero's small corners on the panels.
quicksettings-radius=8
quicksettings-tile-radius=4
notifications-radius=8
notifications-card-radius=4

# The taskbar (taskbar/aero.conf): Windows 7's, the orb and glossy buttons
# on a translucent sky-blue bar with a white edge, Start at the left.
taskbar-height=40
taskbar-align-left=1
taskbar-start-glyph=1
taskbar-spacing=2
taskbar-button-width=54
taskbar-button-height=38
taskbar-button-radius=3
taskbar-icon-size=28
taskbar-button-gloss=1
taskbar-button-fill=#668EB8E8
taskbar-button-fill-active=#B3C7DDF5
taskbar-button-stroke=#CCFFFFFF
dark.taskbar=#1A4A9BE0
light.taskbar=#1A4A9BE0
taskbar-stroke=#B3FFFFFF
taskbar-bounce=0
taskbar-task-view=0
# Windows 7's pictures, if installed in themes/assets/aero/ (Windhawk's
# Windows7 theme resources); without them the drawn look above stays.
taskbar-orb=asset:aero/orbNormal.png
taskbar-orb-pressed=asset:aero/orbPressed.png
taskbar-tile-image=asset:aero/InactiveNormal.png
taskbar-tile-image-active=asset:aero/ActiveNormal.png
taskbar-tile-image-hover=asset:aero/InactivePointerOver.png
taskbar-tile-image-idle-hover=asset:aero/notRunningPointerOver.png
taskbar-reflection=asset:aero/AeroPeek.png
taskbar-reflection-opacity=0.55
taskbar-desktop-image=asset:aero/desktopNormal.png
taskbar-desktop-image-hover=asset:aero/desktopPointerOver.png

# Start (startmenu/down-aero.conf): Windhawk's "Down Aero", 650 wide, 520 high,
# CornerRadius=30.
startmenu-width=650
startmenu-height=520
startmenu-radius=30

# Quick settings and the notification center (notifications/aero.conf): glass
# panels, their own fill nearly gone, Windows 7's lit edge and streaks.
dark.quicksettings-surface=#0A2B2B2B
light.quicksettings-surface=#0AFCFCFC
dark.notifications-surface=#0A2B2B2B
light.notifications-surface=#0AFCFCFC
notifications-glass=1
notifications-reflection=asset:aero/AeroPeek.png
notifications-reflection-opacity=0.3
