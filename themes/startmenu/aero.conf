# Aero: Windows 7's Start menu: the programs and the search on white at the
# left, the places and Shut down on the glass at the right; opens at the
# bottom left corner, compact like the original (about 63:37 columns).
# Original author: lowell
startmenu-layout=1
startmenu-width=526
startmenu-height=606
startmenu-radius=8
menu-layout=1
# Clear glass, the same blur look as the Aero taskbar and quick settings: each
# surface keeps its own, so another taskbar style leaves this one alone.
blur-saturation=1.7
blur-strength=2.0
blur-tint=0
