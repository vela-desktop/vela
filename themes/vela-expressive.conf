# Vela Expressive: tonal colors from your wallpaper or accent, round shapes and lively motion, inspired by Material 3 Expressive
# Its palette is Material's Tonal Spot scheme of the wallpaper's color (or of
# the accent, Settings > Colors), so the file sets no color. Corners are
# steps of M3's corner scale; the shell's layout is Vela's own reading of it
# (M3 has no desktop shell).
# Original author: Brando Giuffrida
schema-version=1
inherits=vela
controls-variant=expressive
motion-variant=expressive
color-source=wallpaper
taskbar-variant=floating
quicksettings-variant=expressive
notifications-variant=expressive
startmenu-variant=expressive
# M3's corner scale: extra small 4, small 8, medium 12, large 16, extra
# large 28.
shapeExtraSmall=4
shapeSmall=8
shapeMedium=12
shapeLarge=16
shapeExtraLarge=28
# Controls small (8), cards medium (M3's filled card, 12), menus and
# flyouts large (M3 Expressive's menu, 16).
radius=8
radiusCard=12
radiusOverlay=16
# The floating taskbar and its buttons fully round (M3's full corners: a 48
# pill, 40 buttons).
taskbar-radius=24
taskbar-button-radius=20
# Panels in extra large corners (28); what they hold 12 inside them in large
# ones (16 = 28 - 12, M3's nested corners).
quicksettings-radius=28
quicksettings-tile-radius=16
notifications-radius=28
notifications-card-radius=16
startmenu-radius=28
