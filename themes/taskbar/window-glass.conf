# Window Glass: Windhawk's Windows 11 Taskbar Styler theme "WindowGlass"
# (Glass variant, Themes/WindowGlass/README.md). Tint SystemChromeMedium at
# 0.7; Height=70, RootGrid Margin 10,2,0,2, CornerRadius=25 (apps and tray one
# pill, Width=Auto: shrunk to its content), TaskListButton CornerRadius=10,
# TaskbarButtonWidth 44, IconSize 30. Scaled down to Vela's own size (lowell:
# 70 was too big): a 48 px pill, the same shape.
dark.taskbar=#B31F1F1F
light.taskbar=#B3E6E6E6
taskbar-height=52
taskbar-margin=2
taskbar-radius=24
taskbar-fit=1
taskbar-button-width=40
taskbar-button-height=36
taskbar-button-radius=8
taskbar-icon-size=24
taskbar-stroke=#00000000
