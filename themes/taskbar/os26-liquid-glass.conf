# OS26 Liquid Glass: Windhawk taskbar styler theme "OS26 Liquid Glass" (Clear MacDock).
# Blur tint #2D101010, CornerRadius 20, Margin 0,8,0,2, Width=Auto, TaskbarFrame
# height 80 (-> 52), icons 24, buttons 55 (-> 40). Icon tiles are images (left out).
dark.taskbar=#2D101010
light.taskbar=#2D101010
taskbar-height=52
taskbar-margin=2
taskbar-radius=20
taskbar-fit=1
taskbar-button-width=40
taskbar-icon-size=24
