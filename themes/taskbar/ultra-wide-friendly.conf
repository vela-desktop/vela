# Ultra Wide Friendly: Windhawk taskbar styler theme "UltraWideFriendly" (Themes/UltraWideFriendly).
# Apps and tray as islands (ControlFillDefault, CornerRadius 10, margin 3, gap 5),
# Width=Auto; ghost bar #66000000 behind them is not expressible.
dark.taskbar=#0FFFFFFF
light.taskbar=#B3FFFFFF
taskbar-margin=3
taskbar-radius=10
taskbar-fit=1
taskbar-split-gap=5
taskbar-split-radius=10
