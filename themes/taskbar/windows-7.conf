# Windows 7: Windhawk taskbar styler theme "Windows7" (Themes/Windows7).
# Height 39, IconSize 32 (-> 24), buttons 58 (-> 40). Aero glass (accent at 0.3),
# orb and taskband images are not expressible.
taskbar-height=40
taskbar-align-left=1
taskbar-start-glyph=1
taskbar-spacing=2
taskbar-button-width=54
taskbar-button-height=38
taskbar-button-radius=3
taskbar-icon-size=28
taskbar-button-gloss=1
taskbar-button-fill=#8C5F7790
taskbar-button-fill-active=#B3A9BBD0
taskbar-button-stroke=#B3FFFFFF
dark.taskbar=#4D3B5B7B
light.taskbar=#4D6C8CB0
taskbar-stroke=#66FFFFFF
