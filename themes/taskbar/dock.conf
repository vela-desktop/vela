# Dock: the apps in a pill on the bottom edge, the tray apart at the right.
# After Windhawk taskbar styler theme "DockLike" (Themes/DockLike).
# RootGrid acrylic SystemChromeAltHigh at 0.8, CornerRadius 8,8,0,0, Width=Auto,
# padding 6. Square bottom corners are not expressible.
# Original author: Lowell137
dark.taskbar=#CC000000
light.taskbar=#CCFFFFFF
taskbar-fit=1
taskbar-stroke=#00000000
taskbar-edge=1
taskbar-margin=0
taskbar-flush=1
taskbar-radius=8
