# Layer Mica UI: Windhawk taskbar styler theme "LayerMicaUI" (Themes/LayerMicaUI).
# OuterRadius 10, InnerRadius 8, RootGrid Margin 8,3,0,3 (Width=Auto), tray its
# own layer (Margin 8 right). Height 52, IconSize 24, buttons 42. Layer tint depends on bgOpacity (default).
taskbar-height=52
taskbar-margin=3
taskbar-radius=10
taskbar-fit=1
taskbar-button-width=42
taskbar-button-radius=8
taskbar-icon-size=24
taskbar-stroke=#00000000
taskbar-edge=2
